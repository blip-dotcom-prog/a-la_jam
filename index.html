<title>à la jam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#3B1D47">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Londrina+Solid:wght@300;400;900&family=Lexend:wght@300;400;600&display=swap">
<script>if(!/[?&]awake\b/.test(location.search))document.documentElement.classList.add("sleep","manila")</script>
<style>/* One screen, built around the keyboard. Deep groove (plum) is home; manila is the other paper. */
:root{
  --k:1;
  color-scheme:dark;
  --ground:#3B1D47; --ground2:#2C1336; --edge:#6B3A78; --ink:#F7E9D7; --ink-soft:#D9B9D9; --word-off:#C9A7C6; --word-on:#FFF3E2;
  --cream:#FBF3E1; --graphite:#2F2A27; --pink:#EE6FA8; --gold:#E0A12E; --teal:#2A8794;
  --display:"Londrina Solid","Arial Narrow",Impact,sans-serif; --note:"Caveat","Comic Sans MS",cursive; --read:"Lexend",Verdana,sans-serif;
  --keysH:clamp(128px,24vh,220px);
}
:root.manila{color-scheme:light;--ground:#E7CB8C;--ground2:#D9B877;--edge:#B38E4A;--ink:#2F2A27;--ink-soft:#5E5145;--word-off:#7A6B5C;--word-on:#2F2A27}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--read);font-weight:300;font-size:16px;line-height:1.5;overflow:hidden;
  background-image:var(--fibre),radial-gradient(120% 90% at 50% 0%,rgba(238,111,168,.10),transparent 55%,rgba(10,0,20,.42) 100%);background-size:420px 420px,100% 100%}
:root.manila body{background-image:var(--fibreM),radial-gradient(120% 90% at 50% 0%,transparent 55%,rgba(150,105,40,.28) 100%)}
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) var(--keysH) auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-sizing:border-box;position:relative}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus{outline:none}:focus-visible{outline:2px solid rgba(224,161,46,.7);outline-offset:5px;border-radius:40% 55% 45% 60%}

/* every choice you can press is a paper tab: hand-cut cream paper, a pencil edge, a little drawn shadow. It sinks when
   you press it. The hand-drawn gold line only marks the one that's chosen (ui/art.js underline). */
.word{font-family:var(--display);font-size:calc(24px * var(--k));letter-spacing:.03em;line-height:1.1;padding:calc(5px * var(--k)) calc(13px * var(--k)) calc(9px * var(--k));position:relative;isolation:isolate;color:#4E3350;
  transition:color .15s,transform .08s;display:inline-block;white-space:nowrap;--tab:#C9A3BD;--tabOn:#F3D9E2;--tabHover:#DABBCF;--tabInk:#2A1233}
.word.small{font-size:calc(19px * var(--k));padding:calc(4px * var(--k)) calc(11px * var(--k)) calc(8px * var(--k))}
.word:hover{color:#3A1F45}
.word[aria-pressed="true"],.word.chosen{color:#3A1F45}
.word .tabbg,.word .tabink{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible;pointer-events:none}
.word .tabbg{transform:translate(calc(2.2px * var(--k)),calc(1.8px * var(--k)));filter:drop-shadow(1.6px 2.6px 0 rgba(18,0,26,.42));transition:filter .08s}
.word .tabbg .tpa{fill:var(--tab);stroke:none}
.word .tabink path{fill:none;stroke:var(--tabInk);stroke-linejoin:round}
.word .tabink .tpi{stroke-width:1.5}
.word .tabink .tpb{stroke-width:.8;opacity:.5}
.word:hover .tpa{fill:var(--tabHover)}
.word[aria-pressed="true"] .tpa,.word.chosen .tpa{fill:var(--tabOn)}
.word:active{transform:translate(1.2px,2.2px)}
.word:active .tabbg{filter:drop-shadow(.4px .6px 0 rgba(18,0,26,.42))}
/* on a pink plate the tabs are pale pink keys drawn in teal marker */
.sheet .word,.plate .word,.cface .word,.cbar .word,.cpop .word{--tab:#F1DCE2;--tabOn:#FFF6F6;--tabHover:#F8E9EC;--tabInk:#17707A}
.sheet .word .tabbg,.plate .word .tabbg,.cface .word .tabbg,.cbar .word .tabbg,.cpop .word .tabbg{filter:drop-shadow(1.4px 2.2px 0 rgba(42,18,51,.38))}
.word .ul{position:absolute;left:9px;bottom:2px;width:calc(100% - 18px);height:12px;overflow:visible;pointer-events:none;clip-path:inset(0 101% 0 0);transition:clip-path .4s cubic-bezier(.3,.7,.3,1)}
.word .ul path{fill:none;stroke-linecap:round}
.word[aria-pressed="true"] .ul,.word.chosen .ul{clip-path:inset(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.word,.word .tabbg,.word .ul{transition:none}}

/* colour calibration */
.calring{width:min(380px,80vw,52vh);display:block;margin:4px auto}
.calring .sw{cursor:pointer;transition:transform .15s;transform-box:fill-box;transform-origin:center}
.calring .sw:hover{transform:scale(1.25)}
.calq{font-family:var(--note);font-size:30px;fill:var(--ink-soft);cursor:pointer}
.calhint{font-family:var(--note);font-size:22px;color:var(--ink-soft);margin:6px 0}
.calcount{font-family:var(--note);color:var(--ink-soft);margin-left:14px}
.caltone{display:inline-block;margin:4px 8px 4px 0;padding:2px 10px;border-radius:40% 55% 45% 60%;background:var(--c);color:#fff;font-family:var(--display);font-size:20px}
.sheet .calhint,.sheet .calcount{color:#5E5145}.sheet .calq{fill:#5E5145}
/* the band's pencil note: what they're doing for you */
.nod{font-family:var(--note);font-size:22px;color:var(--pink);transform:rotate(-2deg);min-height:1.3em;opacity:0;transition:opacity .6s}
.nod.on{opacity:.9}
.row.wrap{flex-wrap:wrap}

/* ===================== controls · strip · drawers (ui/controls.js, ui/strip.js, ui/drawers.js) ===================== */
/* one control: a real button holding a pencil-drawn canvas, its word under it */
.ctl{position:relative;display:inline-grid;justify-items:center;align-content:end;min-width:44px;min-height:44px;padding:2px 4px;color:var(--graphite);
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.ctl canvas{display:block;pointer-events:none}
.ctl-knob{touch-action:pan-x}
.clabel{font-family:var(--read);font-weight:400;font-size:13px;line-height:1.15;color:#2F2A27;white-space:nowrap;margin-top:1px}
.ctl-drawer .clabel,.ctl-stripL .clabel{font-size:15px}
.ctl:focus-visible{outline:2px solid rgba(201,138,30,.8);outline-offset:2px}
.cnum{display:inline-block;margin-right:6px;font-family:var(--note);font-weight:700;font-size:13px;line-height:1;color:rgba(47,42,39,.42);pointer-events:none}
.ctl-action .cnum{font-size:15px;margin-right:7px;vertical-align:2px}
@media (hover:none){.cnum{display:none}}
.pinwrap{position:absolute;right:-4px;top:-6px;display:none;pointer-events:none}
.ctl.pinned .pinwrap{display:block}
.pinmark{width:12px;height:15px;transform:rotate(14deg)}
.cnote{position:absolute;bottom:calc(100% - 4px);left:50%;transform:translateX(-50%) rotate(-3deg);font-family:var(--note);font-weight:700;font-size:19px;color:#9C3A72;
  white-space:nowrap;pointer-events:none;transition:opacity .6s;z-index:2}
.cnote.go{opacity:0}
/* action words and plain-word choices sit on cream, so they write in graphite */
.ctl-action{font-size:21px;align-self:center;min-height:40px;padding:6px 13px 10px}
.ctl-words{display:flex;align-items:center;gap:8px 8px;flex-wrap:wrap}
.ctl-words .k{font-family:var(--note);font-size:19px;color:#5E5145}

/* drawers: one plate per section */
.sheet h3{margin-right:70px}
.dintro{font-size:16px;margin:0 0 8px!important}
.plates{display:flex;flex-wrap:wrap;gap:16px 20px;margin:6px 0 4px;align-items:flex-start}
.plate{position:relative;padding:12px 22px 12px;min-width:0;max-width:100%;box-sizing:border-box}
.platebg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.plate>h4{position:relative;margin:0 0 4px;font-family:var(--note);font-weight:700;font-size:20px;line-height:1;color:#5E5145}
.plate .ctls{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 22px}
.pinhint{font-family:var(--note);font-size:18px;color:#7A6B5C;margin:2px 0 12px!important}
.dextra{margin-top:6px}
.credits{font-size:14px;color:#5E5145}
@media (max-width:720px){
  .sheet .plate{padding:10px 14px;width:100%}
  .plate .ctls{gap:8px 14px}
  .drawers{gap:4px 16px}
}
/* ---------- the song (src/song/*): the road, the cue words, the chord tiles ---------- */
/* where there's room, the cue words sit on the "next" line, by the chord name */
.cues .cue{font-size:16px;position:relative}
.cue .cn{font-family:var(--note);font-size:17px;margin-left:5px;color:var(--pink)}
.cue .cn:empty{display:none}
.cue .cring{position:absolute;left:-10px;top:-5px;width:calc(100% + 20px);height:calc(100% + 6px);color:var(--gold);opacity:0;transition:opacity .8s;pointer-events:none}
.cue.offered .cring{opacity:.7}
.cue.offered{color:#2F2A27}
.chordstrip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:4px 0 8px}
.ctiles{display:flex;flex-wrap:wrap;gap:6px 8px}
.word.ctile{padding:0 0 9px;font-size:0;line-height:0;transition:transform .12s ease-out}
.word.ctile canvas{display:block}
.word.ctile.pulse{transform:translateY(-2px) rotate(-1.2deg) scale(1.05)}
.word.ctile[aria-current] .ul{clip-path:inset(0 0 0 0)}
.ctwords{display:flex;gap:4px 16px;align-items:baseline}
.ctwords .word[disabled]{opacity:.35;pointer-events:none}
@media (prefers-reduced-motion:reduce){.word.ctile,.cue .cring{transition:none}.word.ctile.pulse{transform:none}}
/* ===================== polish: first ten seconds, cues panel, folds ===================== */
[hidden]{display:none!important}
/* the cue words: their own little bracketed panel with a pencil label */
.cues{position:relative;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.cues .cbr{display:none}
.cuetag{font-family:var(--note);font-size:16px;line-height:1;color:#7A6B5C;white-space:nowrap;margin-right:3px}
/* plain-word choices: a theory name written small after the sound word; long lists fold behind a word */
.ctl-words .theory{font-family:var(--read);font-weight:300;font-size:12px;letter-spacing:0;color:#9A8C7F}
.ctl-words .folded{display:none}
.ctl-words.unfolded .folded,.ctl-words .folded.chosen{display:inline-block}
.ctl-words .morew,.fine .finew{font-family:var(--note);font-size:19px;color:#9C3A72!important;letter-spacing:0}
.fine{position:relative;margin-top:2px}
.fine .finectls{margin-top:4px}
/* the sketchbook: chords you found, tap to hear them */
.row.sketch{margin-top:6px}
.row.sketch .skw{font-size:20px}
.sknone{font-size:15px;color:#7A6B5C}
@media (prefers-reduced-motion:reduce){.blob.invite{animation:none}}

/* ===================== the face, run 2 (docs/UX-DESIGN.md "Run 2") ===================== */
[hidden]{display:none!important}
:root{--keysH:clamp(200px,36vh,340px)}
.app{grid-template-rows:auto minmax(0,1fr) var(--keysH) auto auto}
.app>.top{grid-row:1}.app>.mid{grid-row:2}.app>.keys{grid-row:3}.app>.under{grid-row:4}.app>.drawers{grid-row:5}

/* the top: the two doors (paper tabs) on the left; keyboard plug · the circle drum · play · tempo · glow · heart rate on the right */
.top{display:flex;align-items:center;flex-wrap:wrap;gap:4px 22px;padding:8px 0 2px}
.wordmark{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.01em;transform:rotate(-2.5deg);color:var(--ink);margin:0}
/* the logo is drawn into the paper like an album title: no bar, it spills a little past the top row (view/logo.js) */
.wordmark svg{display:block;width:clamp(200px,24vw,350px);height:auto;margin:-2px -10px -20px -8px;overflow:visible;pointer-events:none}
.wordmark[data-v="3"] svg{width:clamp(180px,20vw,290px);margin-bottom:-26px}
.doors{display:flex;gap:8px}
.doors .word{font-size:25px;padding:5px 16px 9px}
.doors .word[aria-pressed="true"]{transform:rotate(-1.5deg) translateY(-1px)}
.transport{display:flex;align-items:center;gap:4px 14px;margin-left:auto}
.blob{width:62px;height:62px;display:grid;place-items:center;background:var(--blobImg) center/contain no-repeat;transition:transform .15s}
.blob:hover{transform:rotate(-4deg) scale(1.04)}
.blob:active{transform:scale(.95)}
.blob svg{width:26px;height:26px}
.drum{width:84px;height:84px;flex:none;margin:-6px 0}
.tempo{display:flex;align-items:center;gap:6px}
.pip{width:32px;height:32px;font-family:var(--display);font-size:23px;background:var(--pipImg) center/contain no-repeat;color:var(--graphite);touch-action:manipulation}
.pip:active{transform:translate(1px,2px)}
.bpmwrap{display:grid;justify-items:center;line-height:1}
.bpm{font-family:var(--display);font-weight:900;font-size:34px;min-width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.spots{display:flex;gap:5px;margin-top:3px;min-height:7px}
.spots i{width:6px;height:6px;border-radius:50% 45% 55% 48%;box-shadow:inset 0 0 0 1.4px var(--ink-soft);opacity:.75}
.spots i.on{background:var(--ink);box-shadow:none;opacity:1}
.fine{display:grid;justify-items:center;min-width:44px;min-height:44px;padding:0 2px;touch-action:none;cursor:ew-resize}
.fine canvas{width:40px;height:40px;display:block;pointer-events:none}
.fine .clabel{color:var(--ink-soft);font-size:12px;margin-top:-3px}
.topsw .ctl{min-height:0}
.ctl.plain .clabel{color:var(--ink-soft)}
/* the keyboard plug and heart rate: pencil on the paper, a word under each */
.plug{position:relative}
.plugb,.heartb{display:grid;justify-items:center;min-width:48px;min-height:44px;padding:0 2px}
.plugb canvas{width:46px;height:34px;display:block;pointer-events:none}
.heartb canvas{width:44px;height:40px;display:block;pointer-events:none}
.plugb .clabel,.heartb .clabel{color:var(--ink-soft);font-size:12px;margin-top:1px;max-width:88px;overflow:hidden;text-overflow:ellipsis}
.plugb.on .clabel{color:var(--ink)}
.heartb .clabel{font-family:var(--note);font-weight:700;font-size:16px;color:#EE8FBC;margin-top:-2px}
.heartb.on .clabel{color:var(--ink)}
.heartb:hover canvas,.plugb:hover canvas{transform:rotate(-5deg) scale(1.06)}
.plugnote{position:absolute;top:calc(100% + 4px);right:-40px;z-index:25;margin:0;width:max-content;max-width:min(300px,80vw);padding:8px 12px 10px;
  background:var(--cream);color:var(--graphite);font-family:var(--note);font-size:19px;line-height:1.15;clip-path:var(--torn);box-shadow:3px 4px 0 rgba(0,0,0,.25)}
.plugnote a{color:#9C3A72;margin-left:4px}

/* the page glow: the beat you feel (view/glow.js) */
.glow{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(ellipse 110% 100% at 50% 45%,transparent 58%,rgba(238,140,150,.18) 82%,rgba(244,170,120,.42) 100%)}
:root.manila .glow{mix-blend-mode:multiply;background:radial-gradient(ellipse 105% 90% at 50% 45%,rgba(214,120,90,.05) 25%,rgba(214,120,90,.28) 72%,rgba(190,90,60,.45) 100%)}

/* the middle: a quiet line (the chord · the band lamps) and the menu cube (Jam), or the painting (Paint) */
.mid{position:relative;min-height:0}
#paint{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .5s;pointer-events:none}
.app[data-door="paint"] #paint{opacity:1}
/* Paint: the sheet gets the room, the keys sit lower and smaller */
@media (min-width:721px){.app[data-door="paint"]{--keysH:clamp(150px,24vh,240px)}}
@media (max-width:720px){.paintplate{gap:2px 6px}.paintplate .paintchord{font-size:22px;margin-right:2px}.paintplate .word.small{font-size:13px;padding:2px 8px 5px}}
:root{--cubeH:216px;--bevel:7px;--turnW:60px}
.face{position:absolute;inset:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"tabs stage lamps" "cube cube cube";gap:0 20px;align-content:end;
  overflow:hidden;padding:2px 0 8px}
.app[data-door="paint"] .face{display:none}
.paintplate{position:absolute;left:0;right:0;top:6px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;pointer-events:none}
.paintplate>*{pointer-events:auto}
.app:not([data-door="paint"]) .paintplate{display:none}
.paintchord{font-family:var(--display);font-size:30px;opacity:.7;margin-right:6px}

/* the chord, small and quiet, and the band's pencil note */
.stage{grid-area:stage;align-self:end;min-width:0;position:relative;padding:0 0 9px;display:flex;align-items:flex-end;gap:0 calc(18px * var(--k,1))}
/* the big pass: the style dial lives up here now, by the chord; the chord now, the chord next, and the scale for it */
.sdial{flex:0 0 auto;margin-bottom:-6px}
.sdial:empty{display:none}
.stagetext{position:relative;min-width:0;flex:1 1 auto}
.scaleline{font-family:var(--note);font-size:calc(22px * var(--k,1));color:#8FD8CF;transform:rotate(-1deg);transform-origin:left;white-space:nowrap}
/* the chord bar was wider than a laptop: the scale's own word goes (the scale is named by the chord, up top) */
@media (max-width:1500px){.cb-scale>.cbk{display:none}}
.scaleline:empty{display:none}
.chordline{display:flex;align-items:baseline;gap:4px 16px;flex-wrap:wrap}
.chordname{font-family:var(--display);font-weight:400;font-size:38px;line-height:1;opacity:.8;transform:rotate(-1.5deg);transition:transform .25s}
.chordname.flip{transform:rotate(1deg) scale(1.04)}
.nextline{font-family:var(--note);font-size:20px;color:var(--ink-soft)}
.nextline b{font-family:var(--display);font-weight:300;font-size:24px;color:var(--ink);opacity:.8}
.nextline.none{visibility:hidden}
.nod{position:absolute;left:0;top:-28px;font-family:var(--note);font-size:22px;color:var(--pink);transform:rotate(-1.5deg);transform-origin:left;opacity:0;transition:opacity .6s;pointer-events:none;white-space:nowrap}
.nod.on{opacity:.95}
.hintline{position:absolute;left:0;top:-28px;white-space:nowrap;font-family:var(--note);font-size:21px;color:var(--ink-soft);margin:0;transform:rotate(-1deg);transform-origin:left;transition:opacity 1.2s;opacity:.9}
.hintline.gone,.nod.on~.hintline{opacity:0}

/* always there: the band lamps and keep that */
#lamps{grid-area:lamps;align-self:end;margin-bottom:5px}
.plamps{display:flex;align-items:center;padding:5px 14px 9px}
.plamps .ctls{position:relative;display:flex;align-items:flex-end;flex-wrap:nowrap;gap:0 4px}
.plamps .ctl{min-height:0}
.plamps .ctl-push{margin-left:10px}

/* the menu cube: one block on a skewer, a turn knob at each end, paper tabs on its top edge */
#panel,.cube{display:contents}
.ctabs{grid-area:tabs;align-self:end;display:flex;gap:5px;padding-left:calc(var(--turnW) + 14px);margin-bottom:-2px;position:relative;z-index:2}
.ctabs .word{font-size:20px;padding:5px 14px 10px}
.ctabs .word[aria-pressed="true"]{transform:translateY(-2px) rotate(-1deg)}
.cbody{grid-area:cube;display:flex;align-items:center;min-width:0}
.cturn{flex:none;width:var(--turnW);display:grid;justify-items:center;align-content:center;position:relative;z-index:1;padding:0}
.cturn canvas{width:56px;height:56px;display:block;pointer-events:none}
.cturn .clabel{color:var(--ink);font-family:var(--note);font-weight:700;font-size:18px;margin-top:-4px}
.cturn:hover canvas{transform:rotate(8deg)}.cturn.cback:hover canvas{transform:rotate(-8deg)}
.cblock{flex:1 1 auto;min-width:0;height:calc(var(--cubeH) + 2 * var(--bevel));position:relative;perspective:1300px;touch-action:pan-y}
.cedge{position:absolute;top:0;left:-26px;width:calc(100% + 52px);height:100%;display:block;pointer-events:none}
.cspin{position:absolute;left:0;right:0;top:var(--bevel);height:var(--cubeH);transform-style:preserve-3d}
.cface{position:absolute;inset:0;display:none;backface-visibility:hidden;box-sizing:border-box}
.cface.on{display:block}
.cface>.platebg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.cin{position:relative;height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:space-evenly;gap:6px 18px;padding:6px 22px}
.cpane{position:relative;min-width:0;display:flex;align-items:center;gap:4px 14px}
.cpane+.cpane{border-left:1.6px solid rgba(47,42,39,.3);padding-left:22px;align-self:stretch}
.cpane .ctls{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;gap:6px 22px}
.cpane-left,.cpane-right,.cpane-band{flex-direction:column;justify-content:center;gap:2px}
.pdial{display:flex;position:relative}
.sctls{flex-direction:column;align-items:center!important;gap:2px 10px!important}
.pnote{margin:0;font-family:var(--note);font-size:18px;color:#9C3A72;line-height:1.1}
.pnote:empty{display:none}
.bandmore{margin-top:8px;font-size:17px!important}
/* the chord corner: how many chords · your chords · the wheels · the section words */
.cpane-chords{display:grid;grid-template-columns:auto auto;grid-template-areas:"size wheels" "note wheels" "cues wheels";align-content:center;align-items:center;gap:2px 16px}
.csize{grid-area:size;justify-content:flex-start!important;gap:4px 14px!important}
.cvamp{display:contents}
.cvamp[hidden]{display:none!important}

/* ===================== find my colours, in Paint (view/paint-colours.js) ===================== */
.paintcal{position:absolute;left:0;right:0;top:44px;bottom:clamp(64px,13%,110px);display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;z-index:3;overflow:hidden}

/* the colours: twelve cut-paper swatches laid on the sheet; they take all the height the words leave them */
.paintcal .calboard{flex:1 1 0;min-height:180px;width:100%;max-width:100%;display:block;touch-action:none;-webkit-tap-highlight-color:transparent;
  outline:none;user-select:none;-webkit-user-select:none;overflow:visible}
.paintcal .calboard:focus-visible .calmidedge{stroke:#E0A12E;stroke-width:5}
.calboard .calsw{cursor:pointer;transform-box:fill-box;transform-origin:center;transform:rotate(var(--rot,0deg));transition:transform .15s}
.calboard .calsw:hover{transform:rotate(var(--rot,0deg)) translateY(-3px) scale(1.04)}
.calboard .calsw.down{transform:rotate(var(--rot,0deg)) translate(1px,2px) scale(.97)}
.calboard .calmid{cursor:pointer}
.calboard .calplay{transform-box:fill-box;transform-origin:center;transition:transform .15s}
.calboard .calmid:hover .calplay{transform:rotate(-4deg) scale(1.04)}
.calboard .calmid:active .calplay{transform:scale(.95)}
.calboard .calswatches{transition:opacity .3s}
.calboard.zoomed .calswatches{opacity:0;pointer-events:none}
.calboard .calother{opacity:0;pointer-events:none;transition:opacity .3s}
.calboard.zoomed .calother{opacity:1;pointer-events:auto}
.calboard .calo{cursor:pointer;opacity:.55;transform-box:fill-box;transform-origin:center;transition:opacity .15s,transform .15s}
.calboard .calo:hover{opacity:1;transform:scale(1.2)}
.calboard .calotherw{font-family:var(--note);font-weight:700;font-size:26px;fill:var(--ink-soft)}
.calboard.zoomed .calnear{opacity:.6}
.calboard .calshade{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:transform .15s}
.calboard .calshade:hover{transform:translateY(-3px) scale(1.05)}
.calboard .calshade:active{transform:translate(1px,2px) scale(.97)}
.calboard .calfan.pop .calshade{animation:calpop .42s cubic-bezier(.3,.7,.3,1.25) both;animation-delay:calc(var(--i,0) * 45ms)}
.calboard .calfan.pop .calcur{animation:calpop .3s ease-out both}
@keyframes calpop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.paintcal .calrow{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:6px 14px;flex-wrap:wrap;margin-top:-14px;position:relative}
.paintcal .calcount{font-size:16px;margin:0;opacity:.75}
/* put it away: a drawn minus in a soft circle, in the picker's corner */
.paintcal .caltuck{position:absolute;top:2px;right:14px;z-index:2;width:44px;height:44px;padding:0;border:0;background:none;cursor:pointer;opacity:.85;
  transition:transform .15s,opacity .15s;-webkit-tap-highlight-color:transparent}
.paintcal .caltuck svg{width:100%;height:100%;display:block;overflow:visible}
.paintcal .caltuck:hover{opacity:1;transform:rotate(-6deg) scale(1.06)}
.paintcal .caltuck:active{transform:translate(1px,2px) scale(.95)}

/* --k (ui/scale.js): 1 on a laptop, ~1.23 at 1920×1080, ~1.64 at 2560×1440; a phone stays at 1. --keysH is set by main.js
   so a white key is ~4.6 times as tall as it is wide at every size, never more than 40% of the screen. */
.app{grid-template-rows:auto minmax(0,1fr) auto var(--keysH) auto auto}

.wakeroom{position:fixed;left:0;top:0;z-index:9001;pointer-events:none}
.wakeroom svg{display:block;overflow:visible}
.wakedim{position:fixed;inset:0;z-index:9006;pointer-events:none;background:#0E0610;opacity:0}

/* the wake's layers sit over the whole app (some of its panels stack high once it wakes) */

/* ===================== Nov 11 (UI round, docs/BUILD-LIST.md "Round: Nov 11, 10:37") ===================== */
/* the keep jar: two white keys wide (ui/cassette.js sets its size and --jarW); the chord bar keeps that much clear */
.cass{transform:rotate(-2deg);transform-origin:60% 100%}
#cbar{padding-right:calc(var(--jarW,96px) + 16px * var(--k))}
@media (max-width:720px){#cbar{padding-right:calc(var(--jarW,66px) + 4px)}}
/* a small laptop window (Henry's preview, 1024×700 to the 1366×800 laptop): everything above the keys keeps its own
   room, nothing slides under the top bar or onto its neighbour */
@media (min-width:721px) and (max-width:1199px){
  /* the two doors a little smaller, the logo too, so the doors sit in open paper between it and the transport (ui/doors.js) */
  .doorsw{gap:6px}
  .door{width:80px;height:45px}.door .dword{font-size:23px}
  .wordmark[data-v="6"] .logohome svg{--lw:clamp(190px,19vw,240px)}
  .transport{gap:4px 10px}
  /* the scale is named in its own window over the keys now, so the line by the chord just says the chord and the next */
  .scaleline{display:none}
  .ctabs .word{font-size:18px;padding:4px 11px 9px}
}
@media (min-width:721px) and (max-height:760px){
  :root{--cubeH:148px}
  .drum{width:64px;height:64px;margin:-4px 0}.blob{width:52px;height:52px}
  .top{padding-top:2px}
  .chart,.diagrams{height:66px}
  .phands .ctl canvas{transform:scale(.86);transform-origin:center bottom}
  .phands .ctls{margin-top:-6px}
}
/* a short laptop: the band lamps' plate a little smaller, so the row it shares with the tabs and the chord fits under
   the top bar (it used to poke up into the glow knob) */
@media (min-width:721px) and (max-height:820px){#lamps{zoom:.82}}
/* the band's words and the first hint (audit error 2: on a laptop they sat above the chord, under the top bar, cut in
   half): there they sit on the chord's own line, at its right end, in the room the scale name leaves */
@media (min-width:721px) and (max-width:1199px),(min-width:721px) and (max-height:820px){
  .nod,.hintline{top:auto;bottom:calc(12px * var(--k));left:auto;right:0;max-width:52%;overflow:hidden;text-overflow:ellipsis;transform:rotate(-1deg);transform-origin:right}
  .stagetext{min-height:calc(44px * var(--k))}
  .scaleline{transition:opacity .4s}
  .stagetext:has(.nod.on) .scaleline,.stagetext:has(.hintline:not([hidden]):not(.gone)) .scaleline{opacity:0}
  /* the first hint is longer: while it shows, it has the line after the chord name to itself */
  .hintline{max-width:min(64%,calc(100% - 6.5em));white-space:normal;line-height:1.02;text-align:right;bottom:calc(2px * var(--k))}
  .stagetext:has(.hintline:not([hidden]):not(.gone)) .nextline{visibility:hidden}
}
@media (min-width:721px) and (max-height:820px){#lamps{margin-bottom:0}}
/* a short laptop: the top bar a little lower (the glow knob and heart rate a touch smaller, the circle drum too), so
   the chord line and the lamps under it keep clear of it */
@media (min-width:721px) and (max-height:820px){#glowSw,#heartSw{zoom:.86}.drum{width:68px;height:68px;margin:-4px 0}}
@media (min-width:721px) and (max-height:760px){.drum{width:62px;height:62px}}
</style>
<div class="glow" id="glow" aria-hidden="true"></div>
<div id="app" class="app">
  <header class="top">
    <h1 class="wordmark" id="logo" aria-label="à la jam">à la jam</h1>
    <div class="moon" id="moon" role="img" aria-label="tonight is a full moon" hidden></div>
    <nav class="doors" aria-label="Where to">
      <button class="word" data-door="jam" aria-pressed="true">Jam</button>
      <button class="word" data-door="paint" aria-pressed="false">Paint</button>
    </nav>
    <nav class="doorsw" id="doorsw" aria-label="jam or paint"></nav>
    <div class="transport">
      <div class="topsw" id="plug"></div>
      <button type="button" class="drum" id="drum" aria-label="the beat: tap to see it big"></button>
      <button class="blob" id="play" aria-label="Play"><svg viewBox="0 0 26 26" aria-hidden="true"><path id="playIcon"/></svg></button>
      <div id="tempo" role="group" aria-label="Tempo"></div>
      <div class="topsw" id="glowSw"></div>
      <div class="topsw" id="heartSw"></div>
    </div>
  </header>

  <main class="mid" id="mid">
    <canvas id="paint" aria-label="The painting your playing makes"></canvas>
    <div class="face" id="face">
      <div class="stage" id="stage">
        <div class="sdial" id="styleDial"></div>
        <div class="stagetext">
          <div class="chordline"><span class="chordname" id="chordName">Dm9</span><span class="nextline"><span>next</span> <b id="nextName">G13</b></span><span class="scaleline" id="scaleName" aria-live="off"></span></div>
          <div class="nod" id="nod" aria-live="polite"></div>
          <p class="hintline" id="hint" hidden></p>
        </div>
      </div>
      <div id="lamps"></div>
      <div id="panel"></div>
    </div>
    <section class="paintplate" id="paintPlate" aria-label="Paint">
      <span class="paintchord" id="pChord"></span>
      <button class="word small" id="freshPaper">new sheet</button>
      <button class="word small" id="keepPaint">keep this painting</button>
      <button class="word small" id="findColours">find my colours</button>
    </section>
    <section class="paintcal" id="paintCal" aria-label="find my colours" hidden></section>
    <button class="colourkey" id="colourKey" aria-label="my colours: tap to find them again" hidden></button>
  </main>

  <div id="cbar" aria-label="your chords and your scale"></div>
  <div id="cpop" hidden></div>
  <div class="keys"><canvas id="kb" aria-label="Keyboard"></canvas></div>
  <div class="under" id="under"><div id="hands"></div><div id="chart" aria-label="the chord chart"></div></div>

  <nav class="drawers" aria-label="More">
    <button class="word small" data-drawer="sound" aria-pressed="false">sound</button>
    <button class="word small" data-drawer="band" aria-pressed="false">band</button>
    <button class="word small" data-drawer="you" aria-pressed="false">you</button>
    <button class="word small" data-drawer="keep" aria-pressed="false">pantry</button>
    <span class="loading" id="loading">tuning the piano…</span>
  </nav>
  <div class="metrobig" id="metroBig" role="dialog" aria-label="the beat, big" hidden><div class="mbin" id="metroBigIn"></div><span class="mbx">tap anywhere to close</span></div>
  <div class="sheet" id="sheet" hidden>
    <button class="sheetx word small" id="sheetX">close</button>
    <div id="sheetIn"></div>
  </div>
</div>
