<meta name="apple-mobile-web-app-capable" content="yes">

<title>à la jam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Londrina+Solid:wght@300;400;900&family=Lexend:wght@300;400;600&display=swap">
<style>/* à la jam on a phone (docs/MOBILE.md): the same plum paper, pencil and paper tabs as the desktop (web/style.css), for
   fingers, sideways or upright (round 4: upright is playable, with the bandstand on top). Nothing on this page scrolls,
   zooms, selects or long-presses. Every control is at least 44 px to a finger. */
:root{color-scheme:dark;--ground:#3B1D47;--ground2:#2C1336;--ink:#F7E9D7;--ink-soft:#D9B9D9;--pink:#EE6FA8;--gold:#E0A12E;--teal:#2A8794;--cream:#FBF3E1;--graphite:#2F2A27;
  --display:"Londrina Solid","Arial Narrow",Impact,sans-serif;--note:"Caveat","Comic Sans MS",cursive;--read:"Lexend",Verdana,sans-serif;--k:1;
  --vvh:100dvh;--sidew:auto;--handw:58px;--lvw:clamp(118px,16vw,152px);--ovw:clamp(100px,13.5vw,128px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}
body{background:var(--ground);color:var(--ink);font-family:var(--read);font-weight:300;
  background-image:var(--fibre),radial-gradient(120% 90% at 50% 0%,rgba(238,111,168,.12),transparent 55%,rgba(10,0,20,.45) 100%);background-size:420px 420px,100% 100%}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus{outline:none}:focus-visible{outline:2px solid rgba(229,139,208,.75);outline-offset:4px;border-radius:40% 55% 45% 60%}
[hidden]{display:none!important}
/* the room glow (view/glowroom.js, the desktop's): a soft light in the song's colour breathing with the band, behind it all */
.mroom{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0}
/* the paint (Nov 18, src/mobile/paint.js): soft daubs of the notes you play on the paper behind everything, fading */
.mpaint{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
/* (round 4, Henry's iPhone in Safari: the bars took a quarter of the screen and the face ran under them) the face is
   sized to what's really on screen (visualViewport, main.js --vvh), and refits when the bars come and go */
.m{position:fixed;left:0;top:0;width:100%;height:var(--vvh);display:grid}

/* the paper tabs (web/style.css .word, the same drawing: ui/art.js underline), with pencil shading under the word (round 4) */
.word{font-family:var(--display);font-size:24px;letter-spacing:.03em;line-height:1.1;padding:5px 14px 9px;position:relative;isolation:isolate;color:#4E3350;
  display:inline-block;white-space:nowrap;--tab:#C9A3BD;--tabOn:#F3D9E2;--tabInk:#2A1233;transition:transform .08s}
.word .tabbg,.word .tabink{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible;pointer-events:none}
.word .tabbg{transform:translate(2.2px,1.8px);filter:drop-shadow(1.6px 2.6px 0 rgba(18,0,26,.42))}
.word .tabbg .tpa{fill:var(--tab);stroke:none}
.word .tabink path{fill:none;stroke:var(--tabInk);stroke-linejoin:round}
.word .tabink .tpi{stroke-width:1.5}.word .tabink .tpb{stroke-width:.8;opacity:.5}
.word .tabshade{position:absolute;inset:3px 3px 2px 4px;width:calc(100% - 7px);height:calc(100% - 5px);z-index:-1;pointer-events:none;opacity:.55}
.word[aria-pressed="true"] .tabshade{opacity:.3}
.word[aria-pressed="true"] .tpa{fill:var(--tabOn)}
.word[aria-pressed="true"]{color:#3A1F45}
.word:active{transform:translate(1.2px,2.2px)}
.word .ul{position:absolute;left:9px;bottom:2px;width:calc(100% - 18px);height:12px;overflow:visible;pointer-events:none;clip-path:inset(0 101% 0 0);transition:clip-path .4s cubic-bezier(.3,.7,.3,1)}
.word .ul path{fill:none;stroke-linecap:round}
.word[aria-pressed="true"] .ul{clip-path:inset(0 0 0 0)}

/* ---------- (Nov 17, Henry: "I think we want the keyboard to run the full screen when it's tipped horizontally… the rat on
   stage with the piano, if we don't get rid of that to make the screen a little bit more dialed") one page, two faces.
   Up top in both: play · the chord now and next · the riff teacher (A B C jam and "show me"). Sideways that's a thin
   strip and the keys take everything under it; the rest sits in the drawer behind the pencil tab. Upright the drawer is
   just part of the page: the riff's level and length under the riff, the band's gadgets, the hands, then the keys. ---------- */
.mplay{grid-area:play;width:52px;height:52px;flex:none;display:grid;place-items:center;align-self:center}
.mplay svg{width:52px;height:52px;overflow:visible}
.mplay:active{transform:translate(1px,2px)}
/* the chord, now and next */
.mchord{grid-area:chord;display:flex;align-items:baseline;gap:10px;white-space:nowrap;min-width:0;align-self:center;text-shadow:2px 3px 0 rgba(18,0,26,.55)}
.mchord b{font-family:var(--display);font-weight:400;font-size:34px;color:var(--cream);letter-spacing:.02em;display:inline-block;transition:transform .12s}
.mchord b.flip{animation:flip .22s ease-out}
.mchord b.beat{transform:scale(1.07)}
@keyframes flip{from{transform:translateY(4px) rotate(-3deg);opacity:.4}to{transform:none;opacity:1}}
.mchord span{font-family:var(--note);font-weight:700;font-size:22px;color:var(--ink-soft);opacity:.85}
/* the riffs (Nov 18, docs/PHONE-UX-AUDIT-NOV18.md): − · the riffs button (and its little lock) · + */
.mriff{grid-area:riff;display:flex;align-items:center;justify-content:center;gap:clamp(8px,4vw,26px);min-width:0}
.mpm{width:48px;height:48px;display:grid;place-items:center;flex:none;transition:opacity .3s}
.mpm svg{width:44px;height:44px;overflow:visible;display:block}
.mpm:active{transform:translate(1px,2px)}
.mriffbox{position:relative;flex:none;display:block}
.mriffbtn{width:clamp(88px,25vw,112px);height:clamp(80px,22vw,100px);display:grid;place-items:center}
.mriffbtn svg{width:100%;height:100%;overflow:visible;display:block}
.mriffbtn:active{transform:translate(1px,2px)}
.mriffbtn.hop svg{animation:hop .36s ease-out}@keyframes hop{40%{transform:translateY(-5px) scale(1.07) rotate(-4deg)}}
.m.riffbusy .mriffbtn svg{animation:wob 1.1s ease-in-out infinite}@keyframes wob{50%{transform:rotate(3deg) scale(1.03)}}
/* the lock: small and quiet, by the button's shoulder, only while he's riffing or a riff is locked (its hit is 44 px) */
.mlock{position:absolute;right:-30px;top:-8px;width:44px;height:44px;display:grid;place-items:center;z-index:3}
.mlock[hidden]{display:none}
.mlock svg{width:34px;height:34px;overflow:visible;display:block;opacity:.85}

.mlock.pop svg{animation:hop .36s ease-out}
/* your space: a warm light on the keys from below, and along their top a ribbon of jam that runs out as the space
   does, with the riff's rhythm on it as faint jam dots */
.mspace{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .45s}
.m.space .mspace{opacity:1}
.mspace .spot{position:absolute;inset:0;background:radial-gradient(ellipse 62% 92% at 50% 106%,rgba(229,139,208,.5),rgba(238,111,168,.22) 56%,transparent 84%)}
/* (v54, Henry: "this odd bar across the top of the screen") the ribbon's gone: your turn is the rat handing it to you
   and the keys lighting up warm */
.mspace .ribbon{display:none}
.mspace .ribbon svg{width:100%;height:100%;display:block;overflow:visible}
.m.space .keys{box-shadow:0 0 0 4px rgba(229,139,208,.5),0 0 34px rgba(229,139,208,.45);animation:yourturn 1.6s ease-in-out 1}
@keyframes yourturn{0%{box-shadow:0 0 0 0 rgba(229,139,208,0)}35%{box-shadow:0 0 0 7px rgba(229,139,208,.7),0 0 48px rgba(229,139,208,.6)}}
/* the pencil tab (sideways only): the way back to the controls */
/* (v52, Henry: "you have to get it right at the bottom") the menu: a 56 px hit, the drawing in its middle, the whole strip tall */
.mtab{grid-area:tab;z-index:21;width:64px;height:100%;min-height:52px;display:none;place-items:center;align-self:stretch;position:relative}
.mtab svg{width:40px;height:40px;overflow:visible}
.mtab:active{transform:translate(1px,2px)}
.keys{grid-area:keys;position:relative;min-height:0;contain:strict}
.keys canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;will-change:transform}

/* the drawer's things */
.word.mpick{grid-area:song;display:inline-flex;align-items:center;gap:6px;font-size:21px;padding:4px 12px 8px;min-height:46px;align-self:center;justify-self:start;transform:rotate(-1deg);max-width:100%;overflow:hidden}
.mpick .caret svg{width:17px;height:13px;display:block;margin-top:4px}
.mhelp{grid-area:help;width:44px;height:44px;flex:none;display:grid;place-items:center;align-self:center}
.mhelp svg{width:36px;height:36px;overflow:visible}
.mhelp:active{transform:translate(1px,2px)}
/* (v54: big, forgiving: the whole box around the little jar is the jar) */
.mrec{grid-area:keep;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:60px;min-height:60px;font-family:var(--note);font-weight:700;font-size:16px;line-height:.9;color:#FBE3EE;align-self:center}
@keyframes recpulse{50%{transform:scale(.9)}}
/* the rat's words, now and then (a jar's "filling…"): a small line over the top, gone in a few seconds */
.nod{position:fixed;left:50%;top:max(6px,env(safe-area-inset-top));transform:translateX(-50%) rotate(-2deg);z-index:40;font-family:var(--note);font-size:20px;color:var(--pink);font-weight:700;opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
.nod.on{opacity:1}
.lat{position:fixed;left:6px;bottom:2px;font-size:14px;color:var(--ink-soft);opacity:.7;pointer-events:none;z-index:40}
/* the band's gadgets: the band (drums and bass on one plate) · the groove knob · sour notes · the speaker */
.mctl{grid-area:ctl;display:grid;grid-template-columns:auto auto auto auto;align-items:center;justify-content:space-between;min-height:0;column-gap:6px}
.mband{display:flex;flex-direction:column;align-items:center}
.lamps{display:flex;gap:2px;padding:4px 6px 2px;border-radius:14px 10px 16px 12px;background:rgba(36,16,46,.7);box-shadow:0 0 0 2px rgba(42,18,51,.9),inset 0 0 0 1px rgba(217,185,217,.18)}
/* (Nov 18, Henry: "someone who doesn't know anything about music") the players as pictures: the ragtag kit, the
   upright bass; out, they're faded and sit a touch lower */
.lamp{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:48px;min-height:52px}
.lamp svg{overflow:visible;display:block;transition:opacity .2s,transform .2s}
.lamp[data-k=drums] svg{width:64px;height:63px}.lamp[data-k=bass] svg{width:40px;height:66px}.lamp[data-k=keys] svg{width:52px;height:58px}
.bw{font-family:var(--note);font-weight:700;font-size:16px;line-height:1;color:var(--ink-soft);margin-top:2px}
.lamp.pressed svg{animation:capdown .22s ease-out}
@keyframes capdown{40%{transform:translateY(5px)}}
.lamp.blink svg{animation:blink .5s steps(2) 8}
@keyframes blink{50%{filter:brightness(1.6) drop-shadow(0 0 6px #E58BD0)}}
.lamp:active,.mout:active,.sour:active{transform:translateY(2px)}
.knobrow{display:flex;justify-content:center}
.knob{display:grid;grid-template-columns:18px auto 18px;grid-template-rows:auto auto;align-items:center;justify-items:center;min-width:88px;min-height:60px;padding:0 2px}
.karrow{display:block}.karrow svg{width:18px;height:22px;opacity:.8;display:block}
.kdial{grid-column:2}.kdial svg{width:56px;height:56px;overflow:visible;display:block;transition:transform .2s}
.knob.turn .kdial svg{animation:knobturn .3s ease-out}
@keyframes knobturn{40%{transform:rotate(var(--kturn,8deg)) scale(1.04)}}
.kword{grid-column:1/4;font-family:var(--note);font-weight:700;font-size:17px;line-height:.9;color:#FBE3EE;margin-top:-2px;white-space:nowrap}
.sour{display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:pointer;min-width:var(--lvw)}
/* (Nov 19, Henry: "sour notes" bigger and in a cooler hand-lettered font, so it's clear the switch does something) the
   display lettering, tipped, with a pink pencil underline */
.sour .sw{font-family:var(--display);font-weight:400;font-size:25px;line-height:1;letter-spacing:.02em;color:#FBE3EE;transform:rotate(-3deg);white-space:nowrap;margin-bottom:3px;
  text-shadow:2px 2px 0 rgba(26,8,32,.55);padding:0 4px}
.sour .sw::after{content:"";display:block;height:4px;margin:1px 2px 0;border-radius:3px 6px 4px 5px;background:#EE6FA8;opacity:.75;transform:rotate(1.5deg)}
.sour .strack{display:block;width:var(--lvw);height:calc(var(--lvw) * .5)}
.sour .strack svg{display:block;width:100%;height:100%;overflow:visible}
.sour .sstops{display:flex;justify-content:space-between;width:var(--lvw);font-family:var(--note);font-weight:700;font-size:15px;line-height:1;color:var(--ink-soft);opacity:.75;padding:0 2px;margin-top:-1px}
.sour .sstops .on{color:#FBE3EE;opacity:1}
.mout{display:block;padding:0;min-height:44px}
.mout .otrack{display:block;width:calc(var(--ovw) * 1.04);height:calc(var(--ovw) * .66)}
.mout .otrack svg{display:block;width:100%;height:100%;overflow:visible}
/* the hands, and (upright) the little phone tipping over: turn me */
.mhandrow{grid-area:hand;display:flex;align-items:center;gap:10px;min-width:0}
.hands{display:flex;gap:8px}
.hands .word{font-size:20px;padding:4px 8px 8px;min-height:46px;min-width:62px;display:flex;align-items:center;justify-content:center}
.mfs{width:44px;height:44px;opacity:.6;display:grid;place-items:center;margin-left:auto}
.mfs svg{width:24px;height:24px;overflow:visible}.mfs:active{transform:translate(1px,1.5px)}
.mtilt{grid-area:tilt;width:72px;height:52px;justify-self:center;display:none;place-items:center;opacity:.9;margin-top:-2px}
.portrait .mtilt{display:grid}
.mfs:not([hidden])+.mtilt{margin-left:0}
.mtilt svg{width:60px;height:52px;overflow:visible}   /* (Nov 17, Henry: "the phone-turn icon, bigger") */
.mtilt.nudge svg{animation:tiltme 1.4s ease-in-out 2}
@keyframes tiltme{30%{transform:rotate(-14deg)}60%{transform:rotate(4deg)}}
/* (v52) the turn-me mime's picture: the big turn-the-phone behind the rat, tipping over with him, gone as he walks off */
.mimepic{position:fixed;z-index:34;pointer-events:none;opacity:0;transform:scale(.85);transition:opacity .45s,transform .45s}
.mimepic.on{opacity:.95;transform:none}
.mimepic svg{width:100%;height:100%;overflow:visible;display:block}
.mimepic.on svg{animation:tiltbig var(--beat,2400ms) ease-in-out infinite;transform-origin:40% 55%}
@keyframes tiltbig{0%,15%{transform:rotate(24deg)}45%,70%{transform:rotate(-62deg)}100%{transform:rotate(24deg)}}
.mtilt:active{transform:translate(1px,2px)}
.mbubble .share{display:inline-block;width:.8em;height:1em;vertical-align:-.12em;margin:0 .1em}

/* ---------- sideways: a strip on top, the keys under it, wall to wall; the drawer drops over the keys ---------- */
.m{grid-template-columns:auto auto auto minmax(0,1fr) auto auto;grid-template-rows:var(--strip,62px) minmax(0,1fr);column-gap:clamp(6px,1.6vw,20px);row-gap:6px;
  grid-template-areas:"play flip chord riff keep tab" "keys keys keys keys keys keys";
  padding:max(12px,env(safe-area-inset-top)) max(6px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left))}
.m:not(.portrait) .mtab{display:grid}
.m:not(.portrait) .mplay,.m:not(.portrait) .mplay svg{width:46px;height:46px}
.m:not(.portrait) .mriff{justify-content:flex-end;gap:clamp(6px,1.6vw,16px);align-self:stretch;align-items:stretch}
/* (v52, Henry's iPhone sideways: "the plus and minus don't seem to be working", the menu only "right at the bottom") an
   installed iPhone app sideways keeps the top edge of the screen for its own swipe, so a tap up there can go missing: the
   strip starts a little lower, and every button in it takes the strip's whole height, the drawing in its middle */
.m:not(.portrait) .mpm,.m:not(.portrait) .mriffbox,.m:not(.portrait) .mplay,.m:not(.portrait) .mrec{align-self:stretch;height:auto;min-height:52px}
.m:not(.portrait) .mpm{display:grid;place-items:center}
.m:not(.portrait) .mriffbox{display:grid;place-items:center}
.m:not(.portrait) .mriffbtn{width:calc(var(--strip,62px) * 1.15);height:calc(var(--strip,62px) - 2px)}.m:not(.portrait) .mpm{width:46px;height:46px}.m:not(.portrait) .mpm svg{width:40px;height:40px}
.m:not(.portrait) .mriffbox{margin-right:30px}.m:not(.portrait) .mlock{right:-42px;top:4px}
.mdrawer{grid-area:keys;z-index:20;display:none;min-height:0;align-self:start;max-height:100%;overflow:hidden;
  grid-template-columns:auto auto minmax(0,1fr) auto auto;grid-template-rows:auto auto;grid-template-areas:"song hand . help ." "ctl ctl ctl ctl ctl";
  align-items:center;column-gap:14px;row-gap:6px;padding:8px 14px 10px;
  background:linear-gradient(180deg,rgba(52,24,64,.985),rgba(44,19,54,.985));border-radius:6px 10px 16px 14px;box-shadow:0 0 0 2px rgba(217,185,217,.22),3px 5px 0 rgba(18,0,26,.5)}
.m.open .mdrawer{display:grid;animation:drop .22s steps(3) both}
/* (v54, Henry: the menu "a little tricky to click on and off") open, a tap anywhere outside the drawer puts it away (the
   keys under it don't play) */
.mscrim{display:none;grid-area:keys;z-index:19;align-self:stretch;margin:0 -6px -6px}
.m.open:not(.portrait) .mscrim{display:block;background:rgba(28,8,34,.18)}
@keyframes drop{from{transform:translateY(-14px);opacity:.3}to{transform:none;opacity:1}}
.m:not(.portrait) .mtilt{display:none}
.m:not(.portrait) .mctl{justify-content:space-around}
@media (max-height:379px) and (orientation:landscape){
  :root{--lvw:clamp(104px,14vw,128px);--ovw:clamp(88px,11.5vw,108px)}
  .m{--strip:56px;row-gap:4px}
  .m:not(.portrait) .mchord b{font-size:28px}.m:not(.portrait) .mchord span{font-size:18px}
  .mdrawer{padding:4px 12px 6px;row-gap:0}
  .mdrawer .lamp[data-k=keys] svg{width:44px;height:49px}.mdrawer .lamp[data-k=drums] svg{width:52px;height:51px}.mdrawer .lamp[data-k=bass] svg{width:32px;height:53px}.mdrawer .lamp{min-height:46px}
  .mdrawer .kdial svg{width:46px;height:46px}
}
@media (max-width:720px) and (orientation:landscape){.m:not(.portrait) .mchord span{font-size:18px}.mdrawer{column-gap:8px}}

/* ---------- upright: play and the song · the chord · the riff teacher (its card) · the band · the hands · the keys ---------- */
.m.portrait{grid-template-columns:auto minmax(0,1fr) auto auto;column-gap:8px;row-gap:6px;
  grid-template-rows:auto auto auto auto auto minmax(140px,1fr) auto;   /* (Nov 19, Henry: the hands came up over the band: each row its own height now; the keys take the rest) */
  grid-template-areas:"play song help keep" "chord chord chord chord" "riff riff riff riff" "ctl ctl ctl ctl" "hand hand hand hand" "keys keys keys keys" "tilt tilt tilt tilt";
  padding:max(6px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  --lvw:clamp(112px,32vw,140px);--ovw:clamp(92px,27vw,116px)}
.portrait .mdrawer{display:contents}
.portrait .mchord{justify-content:center;padding:2px 0}
.portrait .mchord b{font-size:clamp(40px,11vw,54px)}
.portrait .mchord span{font-size:clamp(22px,6vw,28px)}
/* the riffs: one card, easy to find */
.portrait .mriff{background:#311639;border-radius:18px 14px 20px 16px;padding:8px 8px 10px}
.portrait .mctl{grid-template-columns:auto auto auto;justify-content:space-between;align-content:center;padding:0 2px}
.portrait .mhandrow .mout{margin-left:auto}
.portrait .keys{margin:0 -8px}
.portrait .mhandrow{padding:0 2px;margin-top:4px}

}

/* ---------- (round 10) the jam jar: the keep jar, the trim, the label, the pantry, the video filling ---------- */
.mrec svg{width:30px;height:46px;overflow:visible}
.m:not(.portrait) .mrec{align-self:stretch;width:60px}.m:not(.portrait) .mrec svg{width:30px;height:46px}
.mrec.full svg{filter:drop-shadow(0 0 6px rgba(238,111,168,.55))}
body.jarup canvas.ratstage{visibility:hidden}
.jsheet{position:absolute;inset:0;z-index:62;display:grid;place-items:center;background:rgba(28,8,34,.62);padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.jcard{position:relative;width:min(100%,900px);height:100%;max-height:560px;background:#F1DCE2;color:#4E3350;border-radius:12px 18px 14px 20px;box-shadow:4px 5px 0 rgba(18,0,26,.5);transform:rotate(-.4deg);padding:10px 12px;display:grid}
.jcard>section{display:none;min-height:0;min-width:0}
.jsheet[data-mode="edit"] .jedit,.jsheet[data-mode="pantry"] .jpantry,.jsheet[data-mode="fill"] .jfill{display:grid}
/* the jar: sideways the trim on the left, the label on the right, the pictures under; upright stacked */
.jedit{grid-template:"trim lab" 1fr "btns btns" auto / 1.25fr 1fr;gap:8px 12px}
.jtrim{grid-area:trim;position:relative;min-height:0}
.jwave{position:absolute;inset:0 0 0 0;width:100%;height:100%;touch-action:none}
.jplay{position:absolute;left:-6px;bottom:-8px;width:56px;height:56px}
.jplay svg{width:100%;height:100%;overflow:visible}
.jlab{grid-area:lab;position:relative;min-height:0;text-align:center}
.jlabel{position:absolute;left:0;right:0;top:52px;bottom:0;width:100%;height:calc(100% - 52px);touch-action:none}
.jlab:has(.jnameb.first) .jlabel{top:70px;height:calc(100% - 70px)}
.jnameb{margin-left:120px;font-family:var(--note);font-weight:700;font-size:26px;line-height:1;color:#7A2370;padding:6px 14px 8px;min-height:44px;background:#FBF5EA;border-radius:6px 10px 7px 12px;box-shadow:2px 3px 0 rgba(18,0,26,.35);transform:rotate(-1.5deg);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.jnameb:active{transform:rotate(-1.5deg) translate(1px,2px)}
/* (Nov 19) the name looks like something you can change: a dotted underline, a pencil, "tap to name" the first time */
.jnameb{display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;column-gap:6px;position:relative;overflow:visible}
.jnameb .jnw{border-bottom:2.5px dotted rgba(122,35,112,.55);padding-bottom:1px;overflow:hidden;text-overflow:ellipsis;max-width:min(52vw,220px)}
.jnameb .jpencil{width:26px;height:26px;flex:none;display:block}.jnameb .jpencil svg{width:100%;height:100%;overflow:visible}
.jnameb .jtapname{display:none;flex-basis:100%;margin-top:1px;font-size:16px;line-height:1;color:#7A2370;opacity:.55;text-align:center;pointer-events:none}
.jnameb.first .jtapname{display:block;animation:breathe 2.4s ease-in-out infinite}
.jtools{position:absolute;left:-4px;top:0;display:flex;align-items:flex-end;gap:0;z-index:2}
.jrub,.jpen{width:46px;height:48px;flex:none}.jrub svg,.jpen svg{width:100%;height:100%;overflow:visible;display:block}
.jpen svg{transition:transform .12s}.jpen[aria-pressed="true"] svg{transform:translateY(-7px) rotate(-6deg)}
.jbtns{grid-area:btns;display:flex;justify-content:center;gap:clamp(18px,6vw,48px);align-items:center}
.jbtns button{width:56px;height:52px;display:grid;place-items:center}
.jbtns button svg{width:46px;height:46px;overflow:visible}
.jbtns button:active{transform:translate(1px,2px)}
.jbtns .jsend{width:76px;height:66px}.jbtns .jsend svg{width:62px;height:62px;filter:drop-shadow(0 0 7px rgba(238,111,168,.5))}
.jname{position:absolute;z-index:3;left:50%;top:12px;transform:translateX(-50%) rotate(-1deg);display:flex;gap:8px;align-items:center;padding:6px 8px 6px 16px;background:#FBF5EA;border-radius:8px 12px 9px 14px;box-shadow:3px 4px 0 rgba(18,0,26,.4)}
.jname input{width:min(64vw,300px);font-family:var(--note);font-weight:700;font-size:30px;color:#7A2370;background:none;border:0;border-bottom:2px solid rgba(58,42,51,.45);padding:2px 4px;-webkit-user-select:text;user-select:text;touch-action:manipulation;outline:none}
.jname .jok{width:48px;height:48px;flex:none}.jname .jok svg{width:100%;height:100%;overflow:visible}
.jsheet.armed .jtoss{animation:wig .3s ease-in-out 2}
@keyframes wig{30%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}
/* the pantry: the word, the jars on a plank, × */
.jpantry{grid-template-rows:auto 1fr;align-items:end;position:relative}
.jword{justify-self:center;width:150px;height:54px}.jword svg{width:100%;height:100%;overflow:visible}
.jshelf{position:relative;display:flex;align-items:flex-end;gap:14px;padding:0 20px 24px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;align-self:center;min-height:0;scrollbar-width:none}
.jshelf::-webkit-scrollbar{display:none}
.jjar{position:relative;z-index:1;flex:none;padding:0}
.jjar canvas{display:block}
.jjar:active{transform:translateY(2px)}
.jjar.fresh{animation:land .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{from{transform:translateY(-40px) rotate(-6deg);opacity:0}}
.jplank{position:absolute;left:6px;bottom:6px;height:22px;width:max(calc(100% - 12px),var(--pw,0px))}.jplank svg{width:100%;height:100%;display:block}
.jempty{width:96px;height:130px;flex:none;margin:0 auto}.jempty i{display:block;width:100%;height:100%;border:2.5px dashed rgba(78,51,80,.4);border-radius:30% 30% 14% 14%/18% 18% 10% 10%}
.jx{position:absolute;right:-6px;top:-6px;width:60px;height:60px;display:grid;place-items:center;z-index:5}
.jx svg{width:46px;height:46px;overflow:visible}.jx:active{transform:translate(1px,2px)}
/* (round 7) the way out: the × and "back to jamming" under it, in every face */
.jbackw{position:absolute;right:0;top:50px;z-index:5;font-family:var(--note);font-weight:700;font-size:19px;line-height:1;color:#9C3A72;padding:6px 6px 10px;min-height:36px;transform:rotate(-3deg)}
.jsheet[data-mode="edit"] .jbackw{display:none}
.jsheet.sent .jx{width:76px;height:76px}.jsheet.sent .jx svg{width:62px;height:62px}.jsheet.sent .jbackw{top:70px;font-size:22px}
.jsheet.sent .jx svg,.jsheet.sent .jbackw{animation:breathe 1.6s ease-in-out infinite}
/* (round 7) the video fills in the background while you label: its canvas is drawn (and recorded) out of sight */
.jsheet[data-mode="edit"] .jfill{display:grid;position:absolute;left:0;top:0;width:2px;height:2px;overflow:hidden;opacity:0;pointer-events:none}
/* the little jar on send fills with jam as the video records; full, it glows */
.jsend{position:relative}.jprog{position:absolute;right:-14px;bottom:2px;width:22px;height:34px;pointer-events:none}.jprog svg{width:100%;height:100%;overflow:visible}
.jbtns .jsend .jprog svg,.jsays .jprog svg{width:100%;height:100%}.jprog:empty{display:none}.jprog.full svg{filter:drop-shadow(0 0 5px rgba(238,111,168,.7))}
.jsays .jprog.big{position:static;display:inline-block;width:34px;height:52px;vertical-align:middle;margin-right:8px}
/* the video filling: the picture as it's drawn, a calm line, then send */
.jfill{grid-template:"vid says" 1fr "vid btns" 1fr / auto 1fr;align-items:center;justify-items:center;gap:4px 16px}
.jvideo{grid-area:vid;height:min(calc(var(--vvh) - 52px),540px);width:auto;aspect-ratio:1;border-radius:6px;box-shadow:3px 4px 0 rgba(18,0,26,.35);background:#F6F0E6}
.jfill .jsays{grid-area:says;align-self:end}.jfill .jbtns{grid-area:btns;align-self:start}
.jsays{margin:0;font-family:var(--note);font-weight:700;font-size:22px;min-height:1.1em}
.jsheet.filling .jsays{animation:breathe 2.4s ease-in-out infinite}
.portrait .jcard{max-height:none}
.portrait .jedit{grid-template:"trim" 1fr "lab" 1.1fr "btns" auto / 1fr}
.portrait .jvideo{height:auto;width:min(100%,520px)}
.portrait .jfill{align-content:center;grid-template:"vid" auto "says" auto "btns" auto / 1fr}

/* the song picker: a scrap of paper that drops down */
.mlist{position:absolute;z-index:40;top:58px;left:70px;padding:14px 18px 12px;background:#F1DCE2;color:#4E3350;border-radius:6px 10px 8px 12px;transform:rotate(-1deg);
  box-shadow:3px 4px 0 rgba(18,0,26,.45);display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-height:70vh;overflow:auto;touch-action:pan-y}
.mlist .word{--tab:#FBF3E1;--tabOn:#FFF6F6;--tabInk:#17707A;font-size:24px;min-height:44px}
.mlist .blurb{margin:0 0 6px 6px;font-family:var(--note);font-size:17px;color:#6B4A68}
/* the tips, behind help: a scrap of paper with the few words the page still has */
.mtips{position:absolute;z-index:45;right:12px;top:58px;max-width:min(360px,calc(100vw - 24px));padding:12px 16px 10px;background:#F1DCE2;color:#4E3350;border-radius:8px 12px 9px 14px;transform:rotate(-.8deg);
  box-shadow:3px 4px 0 rgba(18,0,26,.45);font-family:var(--note);font-weight:700;font-size:19px;line-height:1.15;max-height:calc(var(--vvh) - 70px);overflow:auto;touch-action:pan-y}
.mtips ul{margin:0;padding:0 0 0 18px}.mtips li{margin:0 0 6px}
.mtips .share{display:inline-block;width:.8em;height:1em;vertical-align:-.12em}
.mtips .mthanks{display:inline-flex;align-items:center;gap:5px;margin:2px 0 0 2px;font-family:var(--note);font-weight:700;font-size:19px;color:#8A6A88;text-decoration:none}
.mtips .mthanks svg{width:16px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;transform:rotate(-6deg)}
.mtips .mspill{display:flex;align-items:center;gap:8px;margin:4px 0 2px;padding:2px 4px;min-height:44px;font-family:var(--note);font-weight:700;font-size:20px;color:#9C3A72;background:none;border:0}
.mtips .mspilljar{display:inline-block;width:30px;height:30px;transform:rotate(-24deg)}.mtips .mspilljar svg{width:100%;height:100%}
.mtips .x{position:absolute;right:2px;top:0;width:44px;height:44px;font-size:22px;color:#9C3A72}

/* ---------- the start: à la jam (the desktop's spilled-jam title) and one big play button ---------- */
.mstart{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:var(--ground);background-image:var(--fibre),radial-gradient(70% 70% at 50% 45%,rgba(238,111,168,.18),transparent 70%);background-size:420px 420px,100% 100%;transition:opacity .6s,visibility .6s}
.begun .mstart{opacity:0;visibility:hidden;pointer-events:none}
.slogo{width:min(80vw,520px,calc(var(--vvh) * 1.35));pointer-events:none}
.slogo svg{width:100%;height:auto;display:block;overflow:visible}
.bigplay{width:min(150px,32vh,40vw);height:min(150px,32vh,40vw);margin-top:-2vh;animation:breathe 2.4s ease-in-out infinite}
.bigplay svg{width:100%;height:100%;overflow:visible}
.bigplay:active{transform:scale(.96) translate(2px,3px);animation:none}
@keyframes breathe{50%{transform:scale(1.04) rotate(-1.5deg)}}
.loading{margin:4px 0 0;font-family:var(--note);font-size:17px;color:var(--pink);min-height:1.2em}

/* ---------- the opening, the jam joke (round 6: you spill it). The bluff: a plain white piano on paper, a jar of jam on
   its lid; press a key and the jam goes over, the rat does a double take, the jam floods into jam land ---------- */
.mintro{position:fixed;inset:0;z-index:64;background:#F6F0E6;overflow:hidden;transition:opacity .4s;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mintro.gone{opacity:0;pointer-events:none}
.ibox{position:relative;margin-top:-4vh}
@media (orientation:landscape){.ibox{margin-top:12vh}}
.ibox>svg{display:block;width:100%;height:100%;overflow:visible}
.ibox.knock{animation:knock .32s ease-out}
@keyframes knock{25%{transform:translate(-4px,2px) rotate(-1deg)}65%{transform:translate(2px,-1px) rotate(.4deg)}}
.ikeys{position:absolute;overflow:hidden;border-radius:2px}
.ikeys .iw{position:absolute;inset:0;background:#FCFAF5;transition:transform .06s,background .06s}
.ikeys .ib{position:absolute;inset:0;background:linear-gradient(#2A2426 var(--bt),#4E3E45 var(--bt));z-index:1;transition:transform .06s}
.ikeys .iink{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.ikeys .iw.down{transform:translateY(1.5px);background:#ECE5DA}
.ikeys .ib.down{transform:translateY(1px);background:linear-gradient(#4A3A40 var(--bt),#5E4E55 var(--bt))}
.ilegs{position:absolute;left:9%;right:9%;top:100%;height:min(10vh,60px);border-left:2.4px solid #2A2426;border-right:2.4px solid #2A2426}
.ijar{position:absolute;transform-origin:18% 100%;z-index:2}
.ijar svg{width:100%;height:100%;overflow:visible}
.ijar.teeter{animation:teeter .19s ease-in-out 2 alternate}
@keyframes teeter{from{transform:rotate(-5deg)}to{transform:rotate(-22deg)}}
.ijar.fall{animation:jarfall .46s cubic-bezier(.5,0,.9,.55) forwards}
@keyframes jarfall{0%{transform:rotate(-22deg)}30%{transform:translate(calc(var(--fx) * .2),-14px) rotate(-60deg)}100%{transform:translate(var(--fx),var(--fy)) rotate(-96deg)}}
.ispill{position:fixed;transform:scale(0);transform-origin:40% 60%;z-index:1;pointer-events:none}
.ispill svg{width:100%;height:100%;overflow:visible}
.ispill.go{animation:splat .42s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes splat{0%{transform:scale(.1,.05)}60%{transform:scale(1.12,.92)}100%{transform:scale(1)}}
.ihat{position:fixed;z-index:67;pointer-events:none;opacity:0}
.ihat svg{width:100%;display:block;overflow:visible}
.ihat.fly{animation:hatfly .9s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes hatfly{0%{opacity:1;transform:translate(0,0) rotate(0)}40%{opacity:1;transform:translate(-30px,-90px) rotate(-200deg)}100%{opacity:1;transform:translate(-60px,-40px) rotate(-340deg)}}
.iflood{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:44% 56% 52% 48%;z-index:3;pointer-events:none;
  background:radial-gradient(circle,#3B1D47 0 62%,#5A1E4C 70%,#9C2E66 80%,#C2407E 86%,#7A1A50 90%,rgba(59,29,71,0) 92%);transform:scale(0)}
.iflood.go{animation:flood 1.2s cubic-bezier(.35,.6,.3,1) forwards}
@keyframes flood{0%{transform:scale(0) rotate(0)}100%{transform:scale(190) rotate(40deg)}}
.ititle{position:fixed;left:50%;top:50%;width:min(80vw,520px,calc(var(--vvh) * 1.35));transform:translate(-50%,-50%) scale(.9);opacity:0;z-index:4;pointer-events:none;transition:opacity .35s,transform .5s cubic-bezier(.2,1.4,.4,1)}
.ititle svg{width:100%;height:auto;display:block;overflow:visible}
.mintro.flooded .ititle{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* round 7: the room (wake.js roomSVG: the floor, the legs, the pedal, the cord to the scorched outlet), the ooze, the short */
.iroom{position:absolute;inset:0;pointer-events:none;z-index:0}
.iroom svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.mintro .ibox,.mlanding .ibox{z-index:1}
.iooze{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.iooze path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 100;stroke-dashoffset:var(--p,100)}
.iooze .o1{stroke:#7A2370;stroke-width:11}
.iooze .o2{stroke:#E7A8E0;stroke-width:2.4;opacity:.8;transform:translate(-1px,-3px)}
/* the zap: a dark flash behind him so his x-ray (cream bones) reads on the paper, flickering with it (~0.4 s) */
.izap{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:2;border-radius:50%;background:radial-gradient(circle,#1a0820 0 38%,rgba(42,18,51,.85) 55%,rgba(42,18,51,0) 72%);opacity:0}
.izap.go{animation:zap .48s steps(1) forwards}
@keyframes zap{0%{opacity:1}23%{opacity:.15}33%{opacity:1}54%{opacity:.15}64%{opacity:1}92%{opacity:1}100%{opacity:0}}
.isparks{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:5;opacity:0}
.isparks svg{width:100%;height:100%;overflow:visible}
.isparks.go{animation:sparks .7s steps(1) forwards}
@keyframes sparks{0%{opacity:1;transform:translate(-50%,-50%) scale(.6) rotate(0)}15%{transform:translate(-50%,-50%) scale(1.1) rotate(12deg)}30%{opacity:.3;transform:translate(-50%,-50%) scale(.9) rotate(-8deg)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(20deg)}65%{opacity:.6;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}85%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(10deg)}100%{opacity:0}}
.mintro.shorted{animation:flick .5s steps(1)}
@keyframes flick{20%{filter:brightness(.82)}40%{filter:none}60%{filter:brightness(.9)}80%{filter:none}}
/* the dough: lumps of jam swelling out of the socket like rising dough, lumpy and fast, till they're the page */
.idough{position:fixed;width:0;height:0;z-index:3;pointer-events:none}
.idough i{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:46% 54% 50% 50%;background:radial-gradient(circle at 40% 35%,#9C3A8C,#7A2370 45%,#3B1D47 80%);box-shadow:0 0 0 2px #2A1233;transform:scale(0)}
.idough i:nth-child(2){left:-10px;top:-14px;border-radius:52% 48% 44% 56%}.idough i:nth-child(3){left:12px;top:-6px}.idough i:nth-child(4){left:-4px;top:-26px;border-radius:40% 60% 55% 45%}.idough i:nth-child(5){left:6px;top:8px}
.idough.go i{animation:dough .75s cubic-bezier(.45,0,.3,1) forwards}
.idough.go i:nth-child(2){animation-delay:.04s}.idough.go i:nth-child(3){animation-delay:.07s}.idough.go i:nth-child(4){animation-delay:.1s}.idough.go i:nth-child(5){animation-delay:.13s}
@keyframes dough{0%{transform:scale(0)}35%{transform:scale(5) rotate(8deg)}60%{transform:scale(22) rotate(-6deg)}85%{transform:scale(70) rotate(4deg)}100%{transform:scale(110) rotate(12deg)}}
.ijar .iknife.fly{animation:kfly .7s ease-in forwards}
@keyframes kfly{30%{transform:rotate(150deg) translate(-10px,-30px)}100%{transform:rotate(220deg) translate(-30px,90px);opacity:0}}

/* ---------- turning the phone (round 4): a quick pencil re-sketch, never a jump; the music never stops ---------- */
.msketch{position:fixed;inset:0;z-index:62;pointer-events:none;display:none}
.msketch svg{width:100%;height:100%}
.msketch.on{display:block;animation:sketchfade .62s steps(5) forwards}
.msketch path{stroke-dasharray:var(--len,2000);stroke-dashoffset:var(--len,2000);animation:sketchline .36s steps(6) forwards}
@keyframes sketchline{to{stroke-dashoffset:0}}
@keyframes sketchfade{0%,45%{opacity:1}100%{opacity:0}}
.m.resketch>*:not(.mdrawer):not(.mlist):not(.mtips):not(.jsheet):not(.mstart):not(.mintro):not(.mlanding):not(.msketch):not(.mhint),.m.resketch.portrait .mdrawer>*{animation:sketchin .48s steps(4) both;animation-delay:var(--sd,0ms)}
@keyframes sketchin{0%{opacity:0;transform:translate(-3px,3px) rotate(-1.2deg)}33%{opacity:.55;transform:translate(2px,-1px) rotate(.8deg)}66%{opacity:.9;transform:translate(-1px,1px) rotate(-.3deg)}100%{opacity:1;transform:none}}

/* (round 8) the rat comes to after the zap: pencil stars round his head */
.mdaze{position:fixed;z-index:37;pointer-events:none;width:60px;height:24px;transform:translate(-50%,-50%);opacity:0;transition:opacity .4s}
.mdaze.on{opacity:1}
.mdaze i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;animation:orbit 1s linear infinite}
.mdaze i:nth-child(2){animation-delay:-.33s}.mdaze i:nth-child(3){animation-delay:-.66s}
.mdaze i svg{width:100%;height:100%;display:block}

.mdaze{transform:translate(-50%,-50%) scaleY(.45)}
/* the rat's line by a control */
.mbubble{position:fixed;z-index:50;padding:5px 12px 7px;background:#FBF3E1;color:#4E3350;font-family:var(--note);font-weight:700;font-size:20px;border-radius:10px 14px 12px 6px;box-shadow:2px 3px 0 rgba(18,0,26,.45);transform:rotate(-2deg);white-space:nowrap;transition:opacity .8s;pointer-events:none}

  font-family:var(--note);font-weight:700;font-size:20px;border-radius:8px 12px 9px 13px;box-shadow:2px 3px 0 rgba(18,0,26,.45);transition:opacity 1.2s;white-space:nowrap}

@media (prefers-reduced-motion:reduce){.mrec.on svg,.bigplay,.mchord b.flip,.lamp.blink svg{animation:none}.m.resketch *{animation:none!important}.msketch{display:none!important}}

/* ---------- "take the jam home" (round 5; round 6: the bluff's "before" picture): iPhone Safari's only way in, Android's

.mlanding{position:fixed;inset:0;z-index:75;background:#F6F0E6;color:#4E3350;overflow:hidden;font-family:var(--note);font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:max(14px,env(safe-area-inset-top)) 16px max(70px,calc(env(safe-area-inset-bottom) + 64px))}
/* the only words: small and quiet (Henry, 20:01: "less words are better") */
.mlanding .lquiet{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.82}
.mlanding .llabel{margin:0;font-family:var(--note);font-weight:700;font-size:17px;color:#8A6A88;letter-spacing:.02em}
.mlanding .lscene{position:relative;display:flex;justify-content:center}
.mlanding .lscene .ibox{margin:0;cursor:pointer}
.mlanding .lpics{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap;max-width:100%}
.mlanding .lpic{display:inline-flex;align-items:center;gap:6px;flex:none}
.mlanding .lshare{width:26px;height:30px;padding:3px 4px;border-radius:8px;background:#FFFDF8;box-shadow:0 0 0 1.6px #8A6A88}
.mlanding .lshare svg{width:100%;height:100%;overflow:visible}
.mlanding .lrow{padding:4px 8px;border-radius:8px;background:#F6E4EA;box-shadow:0 0 0 1.6px #8A6A88;font-family:var(--read);font-weight:400;font-size:13px;color:#4E3350;white-space:nowrap}

.mlanding .licon{flex-direction:column;gap:2px;font-size:12px;color:#4E3350}
.mlanding .licon img{width:40px;height:40px;border-radius:10px;box-shadow:0 0 0 2px #2F2A27;display:block}
.mlanding .larrow{width:24px;height:14px;flex:none}
.mlanding .lhelp{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:52px;height:52px;display:grid;place-items:center}
.mlanding .lhelp svg{width:44px;height:44px;overflow:visible}
.mlanding .lsteps{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 58px);max-width:min(380px,calc(100vw - 24px));padding:12px 16px 10px 10px;background:#F1DCE2;color:#4E3350;border-radius:8px 12px 9px 14px;transform:rotate(-.8deg);box-shadow:3px 4px 0 rgba(42,36,38,.35);font-size:19px;line-height:1.2;z-index:3}
.mlanding .lsteps ol{margin:0;padding-left:26px}.mlanding .lsteps li{margin:0 0 6px}.mlanding .lsteps p{margin:4px 0 0 6px;font-size:17px;color:#6B4A68}
.mlanding .lsteps .share,.mlanding .lsteps .addmark{display:inline-block;width:.9em;height:1em;vertical-align:-.12em}
.mlanding .lsteps .x{position:absolute;right:0;top:0;width:44px;height:44px;font-size:22px;color:#9C3A72}
.mlanding .linstall{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px}
.mlanding .linstall svg{width:84px;height:84px;overflow:visible}

/* (Nov 17, the front door) on an iPad the quiet words were phone sized (17 and 13 px on a 1180 px page): readable through size, still quiet */
@media (min-width:900px) and (min-height:700px){.mlanding .llabel{font-size:23px}.mlanding .lrow{font-size:17px;padding:6px 11px}.mlanding .addmark{width:20px;height:20px}.mlanding .lshare{width:34px;height:40px}.mlanding .larrow{width:30px;height:17px}.mlanding .lpics{gap:9px}.mlanding .lhelp{width:64px;height:64px}.mlanding .lhelp svg{width:54px;height:54px}}
/* the jar perched on the piano (the opening and the landing): tipped up on an edge, still. It never wobbles by itself:
   only when you play (Henry, 21:44). The opening: each note rocks it a bit more (.rock1, .rock2) and a few notes knock it over */
.ijar.perch{transform:rotate(-8deg)}
.ijar.rock1{animation:rock1 .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes rock1{25%{transform:rotate(-14deg)}60%{transform:rotate(-5deg)}100%{transform:rotate(-8deg)}}
.ijar.rock2{animation:rock2 .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes rock2{25%{transform:rotate(-20deg)}55%{transform:rotate(-6deg)}100%{transform:rotate(-12deg)}}
/* the butter knife standing in the jam, its handle out over the rim; a touch tips it a little (the landing) */
.ijar .iknife{position:absolute;right:46%;top:22%;width:120%;height:24%;transform-origin:100% 50%;transform:rotate(118deg);z-index:-1}
.ijar .iknife svg{width:100%;height:100%;display:block;overflow:visible}
.ijar .iknife.tip{animation:ktip .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes ktip{30%{transform:rotate(132deg)}100%{transform:rotate(118deg)}}
.ijar.nudge{animation:nudge .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes nudge{25%{transform:rotate(-15deg)}55%{transform:rotate(-4deg)}100%{transform:rotate(-8deg)}}

/* ?buzz (retired in round 8; this comment stays: it ends the landing block that tools/opening-css.mjs lifts into the iPad page) */


/* ---------- (v55) upright is the lobby: no keys, no riffs; the big turn-the-phone where the keys were, the rat's floor
   under it, and a quiet "play here anyway" at the foot ---------- */
.mhererow{display:none;grid-area:here;align-items:center;justify-content:center;gap:10px;min-height:44px}
.portrait .mhererow{display:flex}
.mhere{font-family:var(--note);font-weight:700;font-size:20px;color:var(--ink-soft);opacity:.75;padding:8px 14px;min-height:44px;text-decoration:underline;text-decoration-style:wavy;text-decoration-color:rgba(217,185,217,.4);text-underline-offset:5px}
.mhere:active{transform:translate(1px,2px)}
.mlockhint{width:40px;height:40px;display:block;animation:hintin .6s ease-out}.mlockhint svg{width:100%;height:100%;overflow:visible}
@keyframes hintin{from{opacity:0;transform:scale(.6) rotate(-20deg)}}
/* playing upright ("play here anyway"): the way back sits small at the foot, beside the turn icon */
.m.portrait:not(.lobby) .mhererow{grid-area:tilt;justify-self:end;align-self:center}
.m.portrait:not(.lobby) .mhere{font-size:17px;padding:6px 4px}
.m.portrait.lobby{grid-template-rows:auto auto minmax(0,1fr) auto minmax(150px,1.3fr) auto;
  grid-template-areas:"play song help keep" "chord chord chord chord" "ctl ctl ctl ctl" "hand hand hand hand" "tilt tilt tilt tilt" "here here here here"}
.m.lobby .keys,.m.lobby .mriff,.m.lobby .hands{display:none}
.m.lobby .mhandrow{justify-content:center}.m.lobby .mhandrow .mout{margin:0 auto}
.m.lobby .mtilt{width:min(62vw,240px);height:auto;aspect-ratio:56/48;align-self:center;opacity:.95}
.m.lobby .mtilt svg{width:100%;height:100%}
.m.lobby .mtilt:not(.nudge) svg{animation:lobbytilt 3.2s ease-in-out infinite;transform-origin:40% 55%}
@keyframes lobbytilt{0%,40%{transform:rotate(0)}60%,85%{transform:rotate(-28deg)}100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.m.lobby .mtilt svg{animation:none}}
/* (Nov 19) the lobby's rat with his phone fills the space where the picture was */
.mtilt{position:relative}
.lobbyrat{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .4s}
.lobbyrat.on{opacity:1}
.m.lobby .mtilt.ratlive{width:100%;height:100%;aspect-ratio:auto;align-self:stretch;max-height:none}
.m.lobby .mtilt.ratlive svg{display:none}
.m:not(.lobby) .lobbyrat{display:none}

/* (Nov 19; 15:09, Henry: "it's hard to click… and you can't tell there's another hand") the hands, sideways: both on the
   strip side by side, left purple and right teal; the one you're playing big and bright, the other small and dim. The
   whole pair is one big target (a tap anywhere on it changes hands) */
.mhandflip{grid-area:flip;display:none;align-items:center;justify-content:center;gap:0;align-self:stretch;min-height:52px;padding:0 2px}
.m:not(.portrait) .mhandflip{display:flex}
.hpick{width:46px;min-height:52px;align-self:stretch;display:grid;place-items:center;transition:transform .15s}
.hpick svg{width:28px;height:28px;display:block;overflow:visible;opacity:.6;filter:saturate(.7);transition:width .15s,height .15s,opacity .15s}
.hpick.on svg{width:42px;height:42px;opacity:1;filter:drop-shadow(0 0 6px rgba(201,167,198,.5))}
.hpick[data-hand=left].on svg{filter:drop-shadow(0 0 7px rgba(156,123,230,.75))}.hpick[data-hand=right].on svg{filter:drop-shadow(0 0 7px rgba(47,163,176,.75))}
.mhandflip.flip .hpick.on svg{animation:hop .36s ease-out}
/* the menu's left and right carry their hands */
.hands .word .hico{display:inline-block;width:22px;height:22px;vertical-align:-4px;margin-right:4px}.hands .word .hico svg{width:100%;height:100%;overflow:visible}
/* (Nov 19: three players on the band's plate, upright) a little smaller, so the row still fits a phone's width */
.portrait .lamp{min-width:44px}.portrait .lamps{gap:0;padding:4px 3px 2px}
.portrait .lamp[data-k=keys] svg{width:40px;height:45px}.portrait .lamp[data-k=drums] svg{width:48px;height:47px}.portrait .lamp[data-k=bass] svg{width:30px;height:50px}

<body>
<div id="room" class="mroom" aria-hidden="true"></div>
<canvas id="paint" class="mpaint" aria-hidden="true"></canvas>
<div id="app" class="m">
  <!-- (Nov 17, Henry: "the keyboard runs the full screen when it's tipped horizontally"; the stage is gone) what you play
       with sits up top in both layouts: play, the chord now and next, the riff teacher (A B C jam and "show me").
       Everything else is in the drawer: on the page upright, behind the pencil tab sideways. -->
  <button type="button" id="play" class="mplay" aria-label="play"></button>
  <div class="mchord" aria-live="off"><b id="chordNow"></b><span id="chordNext"></span></div>
  <!-- (Nov 18, Henry's calls on the UX audit: docs/PHONE-UX-AUDIT-NOV18.md) the riffs: one button, a less and a more
       either side of it that reshape the riff you just heard, and (v55) "again", a loop arrow that shows up once he's played one -->
  <div class="mriff" role="group" aria-label="riffs">
    <button type="button" id="less" class="mpm" aria-label="plainer: the same riff, a step simpler"></button>
    <span class="mriffbox"><button type="button" id="riffBtn" class="mriffbtn" aria-label="riffs: the rat comes and plays one, then gives you space"></button><button type="button" id="again" class="mlock" aria-label="that riff again" hidden></button></span>
    <button type="button" id="more" class="mpm" aria-label="fancier: the same riff, a step fancier"></button>
  </div>
  <!-- (v52, Henry: "sideways, the jam jar is gone") the keep jar lives on the page itself now, upright by the help, sideways on the strip -->
  <!-- (Nov 19) sideways, the hand switch on the strip: both hands, left purple and right teal, the one you're playing big -->
  <div id="handFlip" class="mhandflip" role="group" aria-label="the hands: left or right"><button type="button" class="hpick" data-hand="left" aria-label="the left hand" aria-pressed="false"></button><button type="button" class="hpick" data-hand="right" aria-label="the right hand" aria-pressed="true"></button></div>
  <button type="button" id="rec" class="mrec" aria-label="keep the last 30 seconds"></button>
  <button type="button" id="tab" class="mtab" aria-label="the controls" aria-expanded="false"></button>
  <div class="keys"><canvas id="kb" aria-label="the keys: play with your fingers"></canvas><div id="space" class="mspace" aria-hidden="true"><span class="spot"></span><span id="ribbon" class="ribbon"></span></div></div>
  <div id="scrim" class="mscrim" aria-hidden="true"></div>
  <div id="drawer" class="mdrawer">
    <button type="button" id="songBtn" class="word mpick" aria-haspopup="listbox" aria-label="pick a song"><span id="songName">Onion Soup</span><span id="songCaret" class="caret"></span></button>
    <button type="button" id="help" class="mhelp" aria-label="help: the tips" aria-expanded="false"></button>
    <span id="nod" class="nod" aria-live="polite"></span><span id="lat" class="lat"></span>
    <div class="mctl" aria-label="the band">
      <div class="mband"><div class="lamps"><button type="button" id="lamp-drums" class="lamp" data-rat="lamp-drums" aria-label="the drums"></button><button type="button" id="lamp-keys" class="lamp" data-rat="lamp-keys" aria-label="the band's chords"></button><button type="button" id="lamp-bass" class="lamp" data-rat="lamp-bass" aria-label="the bass"></button></div><span class="bw">band</span></div>
      <div class="knobrow"><button type="button" id="knob" class="knob" aria-label="the groove: tap the right side for more, the left for less"><span id="knobDn" class="karrow dn" aria-hidden="true"></span><span id="knobDial" class="kdial"></span><span id="knobUp" class="karrow up" aria-hidden="true"></span><span id="knobWord" class="kword"></span></button></div>
      <div id="sour" class="sour" role="slider" aria-label="sour notes" aria-valuemin="0" aria-valuemax="2" tabindex="0"><span class="sw">sour notes</span><span class="strack"></span><span class="sstops"><span>ring</span><span>soft</span><span>silent</span></span></div>
      <button type="button" id="out" class="mout" aria-pressed="false" aria-label="iPhone speaker or headphones and speakers"><span class="otrack"></span></button>
    </div>
    <div class="mhandrow">
      <div class="hands" role="group" aria-label="the hands"><button type="button" class="word small" data-hand="left" aria-pressed="false">left</button><button type="button" class="word small" data-hand="right" aria-pressed="true">right</button></div>
      <button type="button" id="fs" class="mfs" aria-label="full screen" hidden></button>
    </div>
  </div>
  <!-- (v54, Henry: the turn-the-phone at the bottom of the screen when upright, to clean up the page) -->
  <button type="button" id="tilt" class="mtilt" aria-label="turn the phone sideways: the keys get the whole screen"></button>
  <!-- (v55, Henry: "play sideways, upright is the lobby") upright you wait in the lobby; for a phone with its rotation lock
       on, a quiet way to play here anyway (and back) -->
  <div class="mhererow"><span id="lockHint" class="mlockhint" aria-hidden="true" hidden></span><button type="button" id="playHere" class="mhere">play here anyway</button></div>
  <div id="songList" class="mlist" hidden></div>
  <div id="tips" class="mtips" hidden role="dialog" aria-label="tips"></div>
  <div id="start" class="mstart">
    <div id="startLogo" class="slogo" role="img" aria-label="à la jam"></div>
    <button type="button" id="bigPlay" class="bigplay" aria-label="play"></button>
    <p id="loading" class="loading">the band is setting up…</p>
  </div>
  <div id="intro" class="mintro"></div>
  <div id="landing" class="mlanding" hidden></div>
  <div id="sketch" class="msketch" aria-hidden="true"></div>
  <p id="hint" class="mhint" hidden></p>
</div>

# a jazz guy: cool, on the beat, not excited about anything. "yeah, what's this? oh, okay, cool."
# one step a line. lines starting with # are notes. see SCRIPT.md for the words he knows.

scene: wake
wake on: jar
look: around \xB7 at suit \xB7 at you
nod: 1

scene: drums
hop to: part-drums
toggle off and on: part-drums     (oh okay)

scene: bass
toggle off and on: part-bass      (cool)

scene: chords
toggle off and on: part-keys      (yeah)
shrug: at part-lead               # the riffs are off already

scene: metronome
walk to: metro
press: metro                      # the big metronome comes up
watch: metro-big, tap foot 2 bars, nod 2   (whoa)
press: metro-big                  # puts it away

scene: the plate
walk to: plate-fold
press: plate-fold                  # the minus: the pink plate folds up
ride: calm-plate down             # and he drops to the scale knob below
look: at you                      (oh okay)
press: calm-lip                   # "tap to bring it back"
ride: calm-plate up               # it unfolds and he bounces back up on it
nod: 1

scene: hands
press: tab-left                   (hm)
press: tab-right                  (oh okay)
press: tab-both                   (cool)

scene: practice modes
wire to: toggle-noteNames
press: toggle-noteNames           (leave it)   # note names on, and he leaves them on (Henry, Nov 13 09:14: the practice modes stay on)
nod: 1

scene: off
exit: stage left

nod: 2                            (cool)
exit: nearest side

`;var gd=`# riff mode's "show me" (the right hand's riffs): he walks out along the bottom of the keys with his olive mallets and
# taps the riff two or three times over, in time with the band (each key sounds and lights as he taps it; his tail gets
# a low landing). Then your turn: he stands right by the riff's keys (never on them) and vibes it out on the beat: a head
# bob, a toe tap, a snap on 2 and 4, a clap on the band's claps (no sitting, Henry). Then he steps straight back in for
# his next turn, and you trade turns like that while the riff is up. Put the riff away and he walks off, a real walk,
# no dance in place first (Nov 17, Henry: "he just kind of wiggled around and then left"). Small, calm, on the beat
# (Nov 14, Henry: smooth moves, close by, no dancing mid-trade, no sitting).
# (Nov 19, Henry: "when he's chilling, he should really get out of the way") on the desktop "sit: by the riff" is his
# chill: off to the stretch you're least likely to play, leaning on a key, listening; tap him and he plays it again.
walk in: under keys
play riff: current
sit: by the riff
trade: turns with you
exit: nearest side

walk to: postcard
look: at postcard                 (hm)
tape up: postcard
look: at you                      (oh okay)
nod: 1
exit: nearest side
