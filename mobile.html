<title>à la jam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Londrina+Solid:wght@300;400;900&family=Lexend:wght@300;400;600&display=swap">
<style>/* à la jam on a phone (docs/MOBILE.md): the same plum paper, pencil and paper tabs as the desktop (web/style.css), for
   fingers, sideways or upright (round 4: upright is playable, with the bandstand on top). Nothing on this page scrolls,
   zooms, selects or long-presses. Every control is at least 44 px to a finger. */
:root{color-scheme:dark;--ground:#3B1D47;--ground2:#2C1336;--ink:#F7E9D7;--ink-soft:#D9B9D9;--pink:#EE6FA8;--gold:#E0A12E;--teal:#2A8794;--cream:#FBF3E1;--graphite:#2F2A27;
  --display:"Londrina Solid","Arial Narrow",Impact,sans-serif;--note:"Caveat","Comic Sans MS",cursive;--read:"Lexend",Verdana,sans-serif;--k:1;
  --vvh:100dvh;--sidew:auto;--handw:58px;--lvw:clamp(118px,16vw,152px);--ovw:clamp(100px,13.5vw,128px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}
body{background:var(--ground);color:var(--ink);font-family:var(--read);font-weight:300;
  background-image:var(--fibre),radial-gradient(120% 90% at 50% 0%,rgba(238,111,168,.12),transparent 55%,rgba(10,0,20,.45) 100%);background-size:420px 420px,100% 100%}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus{outline:none}:focus-visible{outline:2px solid rgba(224,161,46,.7);outline-offset:4px;border-radius:40% 55% 45% 60%}
[hidden]{display:none!important}
/* the room glow (view/glowroom.js, the desktop's): a soft light in the song's colour breathing with the band, behind it all */
.mroom{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0}
/* (round 4, Henry's iPhone in Safari: the bars took a quarter of the screen and the face ran under them) the face is
   sized to what's really on screen (visualViewport, main.js --vvh), and refits when the bars come and go */
.m{position:fixed;left:0;top:0;width:100%;height:var(--vvh);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 24px minmax(0,1fr);
  padding:max(6px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

/* the paper tabs (web/style.css .word, the same drawing: ui/art.js underline), with pencil shading under the word (round 4) */
.word{font-family:var(--display);font-size:24px;letter-spacing:.03em;line-height:1.1;padding:5px 14px 9px;position:relative;isolation:isolate;color:#4E3350;
  display:inline-block;white-space:nowrap;--tab:#C9A3BD;--tabOn:#F3D9E2;--tabInk:#2A1233;transition:transform .08s}
.word .tabbg,.word .tabink{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible;pointer-events:none}
.word .tabbg{transform:translate(2.2px,1.8px);filter:drop-shadow(1.6px 2.6px 0 rgba(18,0,26,.42))}
.word .tabbg .tpa{fill:var(--tab);stroke:none}
.word .tabink path{fill:none;stroke:var(--tabInk);stroke-linejoin:round}
.word .tabink .tpi{stroke-width:1.5}.word .tabink .tpb{stroke-width:.8;opacity:.5}
.word .tabshade{position:absolute;inset:3px 3px 2px 4px;width:calc(100% - 7px);height:calc(100% - 5px);z-index:-1;pointer-events:none;opacity:.55}
.word[aria-pressed="true"] .tabshade{opacity:.3}
.word[aria-pressed="true"] .tpa{fill:var(--tabOn)}
.word[aria-pressed="true"]{color:#3A1F45}
.word:active{transform:translate(1.2px,2.2px)}
.word .ul{position:absolute;left:9px;bottom:2px;width:calc(100% - 18px);height:12px;overflow:visible;pointer-events:none;clip-path:inset(0 101% 0 0);transition:clip-path .4s cubic-bezier(.3,.7,.3,1)}
.word .ul path{fill:none;stroke-linecap:round}
.word[aria-pressed="true"] .ul{clip-path:inset(0 0 0 0)}

/* ---------- the top: play · the song and its chord · the riffs and expand · help · keep ---------- */
.mtop{display:flex;align-items:center;gap:clamp(4px,1.2vw,12px);min-height:60px;position:relative;z-index:3}
.mplay{width:52px;height:52px;flex:none;display:grid;place-items:center}
.mplay svg{width:52px;height:52px;overflow:visible}
.mplay:active{transform:translate(1px,2px)}
.msong{display:flex;flex-direction:column;min-width:0;flex:0 1 auto;line-height:1}
/* the song picker: the song's name on a paper tab, a pencil arrow on it (the hit area reaches 44 px: ::after) */
.word.mpick{display:inline-flex;align-items:center;gap:6px;font-size:clamp(17px,5vh,22px);padding:4px 12px 8px;min-height:46px;align-self:flex-start;transform:rotate(-1deg)}
.mpick .caret svg{width:17px;height:13px;display:block;margin-top:4px}
.mchord{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.mchord b{font-family:var(--display);font-weight:400;font-size:clamp(26px,5.2vh,38px);color:var(--cream);letter-spacing:.02em;display:inline-block}
.mchord b.flip,.schord b.flip{animation:flip .22s ease-out}
@keyframes flip{from{transform:translateY(4px) rotate(-3deg);opacity:.4}to{transform:none;opacity:1}}
.mchord span{font-family:var(--note);font-size:20px;color:var(--ink-soft);opacity:.8}
.mriffrow{display:flex;align-items:center;justify-content:space-around;gap:clamp(4px,1.2vw,12px);flex:1 1 auto;min-width:0}
/* riff: the word, and the cartoon letters (A B C · jam) over their slider, the one up glowing; the level ladder */
.mriff{display:flex;align-items:center;gap:clamp(2px,1vw,10px);min-width:0}
.rword{font-family:var(--display);font-size:clamp(20px,6vh,30px);color:var(--cream);transform:rotate(-3deg);letter-spacing:.02em}
.mriffs{display:flex;gap:2px}
.jarl{width:44px;height:44px;flex:none}
.jarl[data-w="jam"]{width:52px}
.jarl svg{width:100%;height:100%;overflow:visible;display:block}
.jarl:active{transform:translateY(2px)}
.rpick{display:flex;flex-direction:column;align-items:stretch;gap:0}
/* the sliders: drawn 24 px tall, their hit area reaching down to 44 (::before) */
.mslide{height:24px;min-width:104px;touch-action:none;cursor:pointer;position:relative;z-index:4}
.mslide::before{content:"";position:absolute;left:0;right:0;top:0;bottom:-20px}
.mslide svg{display:block;width:100%;position:relative}
.rpick .mslide{margin:0 4px}
.ladder{width:44px;height:46px;flex:none;display:grid;place-items:center;transition:opacity .3s}
.ladder svg{width:28px;height:44px;overflow:visible}
.ladder.faint{opacity:.4}
.mexp{flex:none;display:flex;flex-direction:column;align-items:stretch;width:clamp(100px,14vw,136px)}
.mexp .ew{text-align:center;line-height:1}
.lstops{display:flex;justify-content:space-between;font-family:var(--note);font-weight:700;font-size:14px;line-height:1;color:var(--ink-soft);padding:0 2px}
.ew{font-family:var(--note);font-weight:700;font-size:15px;color:var(--ink-soft)}
/* help: a pencil "?" (round 4: the text tips live behind it) */
.mhelp{width:44px;height:44px;flex:none;display:grid;place-items:center}
.mhelp svg{width:36px;height:36px;overflow:visible}
.mhelp:active{transform:translate(1px,2px)}
/* keep: one button (a pencil dot) */
.mrec{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:46px;min-height:50px;font-family:var(--note);font-weight:700;font-size:16px;line-height:.9;color:#FBE3EE}
.mrec svg{width:36px;height:36px;overflow:visible}
.mrec.on svg{animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{50%{transform:scale(.9)}}

/* the pencil line: the riff's say-it words, the band's words */
.mline{display:flex;align-items:center;justify-content:center;gap:18px;font-family:var(--note);font-size:21px;line-height:1;white-space:nowrap;overflow:hidden;position:relative}
.say{color:#FBE3EE;letter-spacing:.02em}
.nod{color:var(--pink);font-weight:700;transform:rotate(-2deg);opacity:0;transition:opacity .5s}
.nod.on{opacity:1}
.lat{font-size:14px;color:var(--ink-soft);opacity:.7}
.mfs{position:absolute;right:0;top:50%;width:44px;height:44px;margin-top:-22px;opacity:.6;display:grid;place-items:center;z-index:4}
.mfs svg{width:24px;height:24px;overflow:visible}.mfs:active{transform:translate(1px,1.5px)}
.mbubble .share{display:inline-block;width:.8em;height:1em;vertical-align:-.12em;margin:0 .1em}

/* ---------- the body (sideways): the hand tabs with the keys · the keys · the band (its lamps, its groove, sour notes, the speaker) ---------- */
.mbody{display:grid;grid-template-columns:var(--handw) minmax(0,1fr) auto;gap:clamp(6px,1.2vw,12px);min-height:0}
.keys{position:relative;min-height:0;contain:strict}
.keys canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;will-change:transform}
/* (round 4, Henry: "the hand tabs sit right on top of the drums and bass lamps, confusing") the hands live by the keys */
.hands{display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:10px}
.hands .word{font-size:clamp(17px,4.6vh,21px);padding:4px 6px 8px;min-height:46px;display:flex;align-items:center;justify-content:center}
/* the band: a paper wing at the side of the stage (the rat steps behind it, never over the controls) */
.mside{display:grid;grid-template-columns:auto auto;grid-template-areas:"lamps sour" "knob out";align-items:center;justify-items:center;align-content:space-around;column-gap:6px;row-gap:2px;min-height:0;padding:2px 6px;position:relative;z-index:36;
  background:linear-gradient(90deg,rgba(44,19,54,.94),rgba(52,24,64,.97));border-radius:14px 8px 10px 16px;box-shadow:-3px 0 0 rgba(217,185,217,.18),inset 1px 0 0 rgba(217,185,217,.25)}
.lamps{display:flex;gap:clamp(6px,1.4vw,14px);grid-area:lamps}
.mside .knobrow{grid-area:knob}.mside .sour{grid-area:sour}.mside .mout{grid-area:out}
.lamp{display:flex;flex-direction:column;align-items:center;min-width:46px;font-family:var(--note);font-weight:700;font-size:15px;line-height:.9;color:var(--ink-soft)}
.lamp svg{width:clamp(38px,10vh,50px);height:clamp(50px,13vh,65px);overflow:visible}
/* the push-button: it goes down under your finger */
.lamp svg .cap{transition:transform .08s}.lamp:active svg .cap{transform:translateY(4px)}
.lamp.pressed svg .cap{animation:capdown .22s ease-out}
@keyframes capdown{40%{transform:translateY(5px)}}
.lamp[aria-pressed="false"]{opacity:.9}
.lamp.blink svg{animation:blink .5s steps(2) 8}
@keyframes blink{50%{filter:brightness(1.6) drop-shadow(0 0 6px #F6C86A)}}
.lamp:active,.mout:active,.sour:active{transform:translateY(2px)}
/* the groove knob: one button; its left half turns it down, its right half up (the arrows are inside it now: round 4,
   Henry: "the chill ↑↓ doesn't work") */
.knobrow{display:flex;justify-content:center}
.knob{display:grid;grid-template-columns:24px auto 24px;grid-template-rows:auto auto;align-items:center;justify-items:center;min-width:104px;min-height:60px;padding:0 2px}
.karrow{display:block}.karrow svg{width:20px;height:24px;opacity:.8;display:block}
.kdial{grid-column:2}.kdial svg{width:clamp(52px,17vh,76px);height:clamp(52px,17vh,76px);overflow:visible;display:block;transition:transform .2s}
.knob.turn .kdial svg{animation:knobturn .3s ease-out}
@keyframes knobturn{40%{transform:rotate(var(--kturn,8deg)) scale(1.04)}}
.kword{grid-column:1/4;font-family:var(--note);font-weight:700;font-size:17px;line-height:.9;color:#FBE3EE;margin-top:-2px}
/* sour notes (round 4, Henry: "a cool hand-drawn switch, a 3-way lever on a gadget"): tap a stop or swing the lever */
.sour{display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:pointer;min-width:var(--lvw)}
.sour .sw{font-family:var(--note);font-weight:700;font-size:15px;line-height:1;color:var(--ink-soft)}
.sour .strack{display:block;width:var(--lvw);height:calc(var(--lvw) * .5)}
.sour .strack svg{display:block;width:100%;height:100%;overflow:visible}
.sour .sstops{display:flex;justify-content:space-between;width:var(--lvw);font-family:var(--note);font-weight:700;font-size:14px;line-height:1;color:var(--ink-soft);opacity:.75;padding:0 2px;margin-top:-1px}
.sour .sstops .on{color:#FBE3EE;opacity:1}
/* iPhone speaker · headphones and speakers (round 8): the same gadget, two stops, pictures not words */
.mout{display:block;padding:0;min-height:44px}
.mout .otrack{display:block;width:var(--ovw);height:calc(var(--ovw) * .5)}
.mout .otrack svg{display:block;width:100%;height:100%;overflow:visible}
/* a short window sideways (iPhone Safari with its bars; round 4): the band's wing in two by two */
@media (max-height:379px) and (orientation:landscape){
  :root{--lvw:clamp(112px,15vw,140px);--ovw:clamp(96px,12.5vw,118px)}
  .m{grid-template-rows:auto 18px minmax(0,1fr)}
  .mtop{min-height:56px}
  .mline{font-size:17px}
  .mplay,.mplay svg{width:46px;height:46px}
  .lamp svg{width:34px;height:44px}
  .kdial svg{width:52px;height:52px}
}
@media (max-width:720px) and (orientation:landscape){.mchord span{display:none}.rword{display:none}.mexp{width:98px}.mtop{gap:5px}.word.mpick{font-size:17px}}
/* sideways, help sits under the hand tabs (main.js moves it): the top row is full */
.hands .mhelp{align-self:center;margin-top:4px}

/* ---------- upright (round 4): the bandstand on top, the riffs, the band's controls, the keys at the bottom ---------- */
.mscene{display:none;position:relative;min-height:0;border-radius:14px 10px 16px 12px;overflow:hidden;box-shadow:0 0 0 2px rgba(42,26,48,.9),3px 4px 0 rgba(18,0,26,.45)}
.mscene canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.schord{position:absolute;left:50%;top:clamp(10px,13%,30px);transform:translateX(-50%) rotate(-1.5deg);display:flex;align-items:baseline;gap:8px;white-space:nowrap;pointer-events:none;
  text-shadow:2px 3px 0 rgba(18,0,26,.6)}
.schord b{font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,54px);color:var(--cream);letter-spacing:.02em;display:inline-block;transition:transform .12s}
.schord b.beat{transform:scale(1.07)}
.schord span{font-family:var(--note);font-size:clamp(18px,5vw,24px);color:var(--ink-soft)}
.m.portrait{grid-template-columns:auto minmax(0,1fr) auto auto;column-gap:8px;row-gap:4px;
  grid-template-rows:auto minmax(76px,1fr) auto auto auto var(--kh,clamp(160px,31vh,330px));
  grid-template-areas:"play song help keep" "scene scene scene scene" "riff riff riff riff" "line line line line" "ctl ctl ctl ctl" "keys keys keys keys"}
.portrait .mtop,.portrait .mbody{display:contents}
.portrait .mplay{grid-area:play}.portrait .msong{grid-area:song;align-self:center;min-width:0}.portrait .mhelp{grid-area:help;align-self:center}.portrait .mrec{grid-area:keep;align-self:center}
.portrait .mchord{display:none}
.portrait .mscene{display:block;grid-area:scene}
.portrait .mriffrow{grid-area:riff;justify-content:space-between}
.portrait .mline{grid-area:line;font-size:18px;justify-content:flex-start;gap:10px;min-height:46px}
/* (round 8) upright the hand tabs sit in the pencil line, right over the keys */
.mline .hands{flex-direction:row;gap:6px;flex:none;position:relative;z-index:5}.portrait .mline{margin-top:18px}.portrait #riffSlide::before{top:0;bottom:-20px}.mline .hands .word{min-width:58px}
/* the band's controls upright: the knob, and sour notes over the speaker */
.portrait .mside{grid-area:ctl;display:grid;grid-template-columns:auto auto auto;grid-template-areas:"knob sour out";align-items:center;justify-content:space-between;background:none;box-shadow:none;padding:0;z-index:auto;column-gap:4px}
.m.portrait{--lvw:clamp(112px,32vw,150px);--ovw:clamp(92px,26vw,118px)}
.portrait .knob{min-width:88px;grid-template-columns:16px auto 16px}.portrait .kdial svg{width:clamp(50px,14vw,64px);height:clamp(50px,14vw,64px)}
.portrait .knobrow{grid-area:knob}
.portrait .sour{grid-area:sour}
.portrait .mout{grid-area:out;justify-self:center}
.portrait .keys{grid-area:keys;margin:0 -8px}
/* the band lamps hang over their players on the bandstand (main.js moves them in) */
.mscene .lamps{position:absolute;left:0;right:0;top:clamp(2px,4%,14px);display:flex;justify-content:space-between;padding:0 calc(18% - 23px);z-index:2;pointer-events:none}
.mscene .lamp{pointer-events:auto}
.mscene .lamp span{text-shadow:1px 2px 0 rgba(18,0,26,.7)}
.portrait .rword{display:none}
.portrait .rpick::before{content:"riff";text-align:center;line-height:1;font-family:var(--note);font-weight:700;font-size:15px;color:var(--ink-soft)}
.portrait .word.mpick{max-width:100%;overflow:hidden}
@media (max-width:370px){.portrait .mexp{width:90px}.portrait .jarl[data-w="jam"]{width:46px}.portrait .mriff{gap:2px}}
@media (max-width:380px){.portrait .mexp{width:96px}.portrait .word.mpick{font-size:18px;padding:4px 9px 8px}}
/* a short bandstand: the chord to the top, smaller */
.mscene.short .schord{top:4px}.mscene.short .schord b{font-size:30px}

/* the kept take: a little jar */
.jarpop{position:absolute;z-index:45;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1deg);display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 18px 14px;
  background:#F1DCE2;color:#4E3350;border-radius:10px 16px 12px 18px;box-shadow:4px 5px 0 rgba(18,0,26,.5)}
.jarpop .jarArt svg{width:96px;height:96px;overflow:visible}
.jarpop .jarSecs{margin:0;font-family:var(--note);font-weight:700;font-size:19px}
.jarpop audio{display:none}
.jarBtns{display:flex;gap:8px}
.jarpop .word{--tab:#FBF3E1;--tabOn:#FFF6F6;--tabInk:#17707A;min-height:44px}

/* the song picker: a scrap of paper that drops down */
.mlist{position:absolute;z-index:40;top:58px;left:70px;padding:14px 18px 12px;background:#F1DCE2;color:#4E3350;border-radius:6px 10px 8px 12px;transform:rotate(-1deg);
  box-shadow:3px 4px 0 rgba(18,0,26,.45);display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-height:70vh;overflow:auto;touch-action:pan-y}
.mlist .word{--tab:#FBF3E1;--tabOn:#FFF6F6;--tabInk:#17707A;font-size:24px;min-height:44px}
.mlist .blurb{margin:0 0 6px 6px;font-family:var(--note);font-size:17px;color:#6B4A68}
/* the tips, behind help: a scrap of paper with the few words the page still has */
.mtips{position:absolute;z-index:45;right:12px;top:58px;max-width:min(360px,calc(100vw - 24px));padding:12px 16px 10px;background:#F1DCE2;color:#4E3350;border-radius:8px 12px 9px 14px;transform:rotate(-.8deg);
  box-shadow:3px 4px 0 rgba(18,0,26,.45);font-family:var(--note);font-weight:700;font-size:19px;line-height:1.15;max-height:calc(var(--vvh) - 70px);overflow:auto;touch-action:pan-y}
.mtips ul{margin:0;padding:0 0 0 18px}.mtips li{margin:0 0 6px}
.mtips .share{display:inline-block;width:.8em;height:1em;vertical-align:-.12em}
.mtips .mthanks{display:inline-flex;align-items:center;gap:5px;margin:2px 0 0 2px;font-family:var(--note);font-weight:700;font-size:19px;color:#8A6A88;text-decoration:none}
.mtips .mthanks svg{width:16px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;transform:rotate(-6deg)}
.mtips .x{position:absolute;right:2px;top:0;width:44px;height:44px;font-size:22px;color:#9C3A72}

/* ---------- the start: à la jam (the desktop's spilled-jam title) and one big play button ---------- */
.mstart{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  background:var(--ground);background-image:var(--fibre),radial-gradient(70% 70% at 50% 45%,rgba(238,111,168,.18),transparent 70%);background-size:420px 420px,100% 100%;transition:opacity .6s,visibility .6s}
.begun .mstart{opacity:0;visibility:hidden;pointer-events:none}
.slogo{width:min(80vw,520px,calc(var(--vvh) * 1.35));pointer-events:none}
.slogo svg{width:100%;height:auto;display:block;overflow:visible}
.bigplay{width:min(150px,32vh,40vw);height:min(150px,32vh,40vw);margin-top:-2vh;animation:breathe 2.4s ease-in-out infinite}
.bigplay svg{width:100%;height:100%;overflow:visible}
.bigplay:active{transform:scale(.96) translate(2px,3px);animation:none}
@keyframes breathe{50%{transform:scale(1.04) rotate(-1.5deg)}}
.loading{margin:4px 0 0;font-family:var(--note);font-size:17px;color:var(--pink);min-height:1.2em}

/* ---------- the opening, the jam joke (round 6: you spill it). The bluff: a plain white piano on paper, a jar of jam on
   its lid; press a key and the jam goes over, the rat does a double take, the jam floods into jam land ---------- */
.mintro{position:fixed;inset:0;z-index:64;background:#F6F0E6;overflow:hidden;transition:opacity .4s;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mintro.gone{opacity:0;pointer-events:none}
.ibox{position:relative;margin-top:-4vh}
@media (orientation:landscape){.ibox{margin-top:12vh}}
.ibox>svg{display:block;width:100%;height:100%;overflow:visible}
.ibox.knock{animation:knock .32s ease-out}
@keyframes knock{25%{transform:translate(-4px,2px) rotate(-1deg)}65%{transform:translate(2px,-1px) rotate(.4deg)}}
.ikeys{position:absolute;overflow:hidden;border-radius:2px}
.ikeys .iw{position:absolute;inset:0;background:#FCFAF5;transition:transform .06s,background .06s}
.ikeys .ib{position:absolute;inset:0;background:linear-gradient(#2A2426 var(--bt),#4E3E45 var(--bt));z-index:1;transition:transform .06s}
.ikeys .iink{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none;overflow:visible}
.ikeys .iw.down{transform:translateY(1.5px);background:#ECE5DA}
.ikeys .ib.down{transform:translateY(1px);background:linear-gradient(#4A3A40 var(--bt),#5E4E55 var(--bt))}
.ilegs{position:absolute;left:9%;right:9%;top:100%;height:min(10vh,60px);border-left:2.4px solid #2A2426;border-right:2.4px solid #2A2426}
.ijar{position:absolute;transform-origin:18% 100%;z-index:2}
.ijar svg{width:100%;height:100%;overflow:visible}
.ijar.teeter{animation:teeter .19s ease-in-out 2 alternate}
@keyframes teeter{from{transform:rotate(-5deg)}to{transform:rotate(-22deg)}}
.ijar.fall{animation:jarfall .46s cubic-bezier(.5,0,.9,.55) forwards}
@keyframes jarfall{0%{transform:rotate(-22deg)}30%{transform:translate(calc(var(--fx) * .2),-14px) rotate(-60deg)}100%{transform:translate(var(--fx),var(--fy)) rotate(-96deg)}}
.ispill{position:fixed;transform:scale(0);transform-origin:40% 60%;z-index:1;pointer-events:none}
.ispill svg{width:100%;height:100%;overflow:visible}
.ispill.go{animation:splat .42s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes splat{0%{transform:scale(.1,.05)}60%{transform:scale(1.12,.92)}100%{transform:scale(1)}}
.ihat{position:fixed;z-index:67;pointer-events:none;opacity:0}
.ihat svg{width:100%;display:block;overflow:visible}
.ihat.fly{animation:hatfly .9s cubic-bezier(.2,.8,.4,1) forwards}
@keyframes hatfly{0%{opacity:1;transform:translate(0,0) rotate(0)}40%{opacity:1;transform:translate(-30px,-90px) rotate(-200deg)}100%{opacity:1;transform:translate(-60px,-40px) rotate(-340deg)}}
.iflood{position:fixed;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:44% 56% 52% 48%;z-index:3;pointer-events:none;
  background:radial-gradient(circle,#3B1D47 0 62%,#5A1E4C 70%,#9C2E66 80%,#C2407E 86%,#7A1A50 90%,rgba(59,29,71,0) 92%);transform:scale(0)}
.iflood.go{animation:flood 1.2s cubic-bezier(.35,.6,.3,1) forwards}
@keyframes flood{0%{transform:scale(0) rotate(0)}100%{transform:scale(190) rotate(40deg)}}
.ititle{position:fixed;left:50%;top:50%;width:min(80vw,520px,calc(var(--vvh) * 1.35));transform:translate(-50%,-50%) scale(.9);opacity:0;z-index:4;pointer-events:none;transition:opacity .35s,transform .5s cubic-bezier(.2,1.4,.4,1)}
.ititle svg{width:100%;height:auto;display:block;overflow:visible}
.mintro.flooded .ititle{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* round 7: the room (wake.js roomSVG: the floor, the legs, the pedal, the cord to the scorched outlet), the ooze, the short */
.iroom{position:absolute;inset:0;pointer-events:none;z-index:0}
.iroom svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.mintro .ibox,.mlanding .ibox{z-index:1}
.iooze{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
.iooze path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100 100;stroke-dashoffset:var(--p,100)}
.iooze .o1{stroke:#7A2370;stroke-width:11}
.iooze .o2{stroke:#E7A8E0;stroke-width:2.4;opacity:.8;transform:translate(-1px,-3px)}
/* the zap: a dark flash behind him so his x-ray (cream bones) reads on the paper, flickering with it (~0.4 s) */
.izap{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:2;border-radius:50%;background:radial-gradient(circle,#1a0820 0 38%,rgba(42,18,51,.85) 55%,rgba(42,18,51,0) 72%);opacity:0}
.izap.go{animation:zap .48s steps(1) forwards}
@keyframes zap{0%{opacity:1}23%{opacity:.15}33%{opacity:1}54%{opacity:.15}64%{opacity:1}92%{opacity:1}100%{opacity:0}}
.isparks{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:5;opacity:0}
.isparks svg{width:100%;height:100%;overflow:visible}
.isparks.go{animation:sparks .7s steps(1) forwards}
@keyframes sparks{0%{opacity:1;transform:translate(-50%,-50%) scale(.6) rotate(0)}15%{transform:translate(-50%,-50%) scale(1.1) rotate(12deg)}30%{opacity:.3;transform:translate(-50%,-50%) scale(.9) rotate(-8deg)}45%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(20deg)}65%{opacity:.6;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}85%{opacity:1;transform:translate(-50%,-50%) scale(1.3) rotate(10deg)}100%{opacity:0}}
.mintro.shorted{animation:flick .5s steps(1)}
@keyframes flick{20%{filter:brightness(.82)}40%{filter:none}60%{filter:brightness(.9)}80%{filter:none}}
/* the dough: lumps of jam swelling out of the socket like rising dough, lumpy and fast, till they're the page */
.idough{position:fixed;width:0;height:0;z-index:3;pointer-events:none}
.idough i{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:46% 54% 50% 50%;background:radial-gradient(circle at 40% 35%,#9C3A8C,#7A2370 45%,#3B1D47 80%);box-shadow:0 0 0 2px #2A1233;transform:scale(0)}
.idough i:nth-child(2){left:-10px;top:-14px;border-radius:52% 48% 44% 56%}.idough i:nth-child(3){left:12px;top:-6px}.idough i:nth-child(4){left:-4px;top:-26px;border-radius:40% 60% 55% 45%}.idough i:nth-child(5){left:6px;top:8px}
.idough.go i{animation:dough .75s cubic-bezier(.45,0,.3,1) forwards}
.idough.go i:nth-child(2){animation-delay:.04s}.idough.go i:nth-child(3){animation-delay:.07s}.idough.go i:nth-child(4){animation-delay:.1s}.idough.go i:nth-child(5){animation-delay:.13s}
@keyframes dough{0%{transform:scale(0)}35%{transform:scale(5) rotate(8deg)}60%{transform:scale(22) rotate(-6deg)}85%{transform:scale(70) rotate(4deg)}100%{transform:scale(110) rotate(12deg)}}
.ijar .iknife.fly{animation:kfly .7s ease-in forwards}
@keyframes kfly{30%{transform:rotate(150deg) translate(-10px,-30px)}100%{transform:rotate(220deg) translate(-30px,90px);opacity:0}}

/* ---------- turning the phone (round 4): a quick pencil re-sketch, never a jump; the music never stops ---------- */
.msketch{position:fixed;inset:0;z-index:62;pointer-events:none;display:none}
.msketch svg{width:100%;height:100%}
.msketch.on{display:block;animation:sketchfade .62s steps(5) forwards}
.msketch path{stroke-dasharray:var(--len,2000);stroke-dashoffset:var(--len,2000);animation:sketchline .36s steps(6) forwards}
@keyframes sketchline{to{stroke-dashoffset:0}}
@keyframes sketchfade{0%,45%{opacity:1}100%{opacity:0}}
.m.resketch .mtop>*,.m.resketch .mscene,.m.resketch .hands,.m.resketch .keys,.m.resketch .mside>*,.m.resketch .mline{animation:sketchin .48s steps(4) both;animation-delay:var(--sd,0ms)}
@keyframes sketchin{0%{opacity:0;transform:translate(-3px,3px) rotate(-1.2deg)}33%{opacity:.55;transform:translate(2px,-1px) rotate(.8deg)}66%{opacity:.9;transform:translate(-1px,1px) rotate(-.3deg)}100%{opacity:1;transform:none}}

/* (round 8) the rat comes to after the zap: pencil stars round his head */
.mdaze{position:fixed;z-index:37;pointer-events:none;width:60px;height:24px;transform:translate(-50%,-50%);opacity:0;transition:opacity .4s}
.mdaze.on{opacity:1}
.mdaze i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;animation:orbit 1s linear infinite}
.mdaze i:nth-child(2){animation-delay:-.33s}.mdaze i:nth-child(3){animation-delay:-.66s}
.mdaze i svg{width:100%;height:100%;display:block}
@keyframes orbit{from{transform:translateY(0) rotate(0deg) translateX(26px) rotate(0deg)}to{transform:translateY(0) rotate(360deg) translateX(26px) rotate(-360deg)}}
.mdaze{transform:translate(-50%,-50%) scaleY(.45)}
/* the rat's line by a control */
.mbubble{position:fixed;z-index:50;padding:5px 12px 7px;background:#FBF3E1;color:#4E3350;font-family:var(--note);font-weight:700;font-size:20px;border-radius:10px 14px 12px 6px;box-shadow:2px 3px 0 rgba(18,0,26,.45);transform:rotate(-2deg);white-space:nowrap;transition:opacity .8s;pointer-events:none}
.mbubble.gone{opacity:0}
/* no sound? (only when the sound is still asleep after a tap: the rest of the tips are behind help) */
.mhint{position:absolute;z-index:46;left:50%;top:66px;transform:translateX(-50%) rotate(-2deg);margin:0;padding:6px 14px 8px;background:#F1DCE2;color:#9C3A72;
  font-family:var(--note);font-weight:700;font-size:20px;border-radius:8px 12px 9px 13px;box-shadow:2px 3px 0 rgba(18,0,26,.45);transition:opacity 1.2s;white-space:nowrap}
.mhint.gone{opacity:0}
/* the rat's stage canvas is see-through to touches (a finger on him plays the key under him) */
.ratstage{pointer-events:none;will-change:transform}
.rathit{pointer-events:none!important}
@media (prefers-reduced-motion:reduce){.mrec.on svg,.bigplay,.mchord b.flip,.schord b.flip,.lamp.blink svg{animation:none}.m.resketch *{animation:none!important}.msketch{display:none!important}}

/* ---------- "take the jam home" (round 5; round 6: the bluff's "before" picture): iPhone Safari's only way in, Android's
   install offer. The same white piano and precarious jar as the opening, no rat, one calm line, the steps as pictures ---------- */
.mlanding{position:fixed;inset:0;z-index:75;background:#F6F0E6;color:#4E3350;overflow:hidden;font-family:var(--note);font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:max(14px,env(safe-area-inset-top)) 16px max(70px,calc(env(safe-area-inset-bottom) + 64px))}
/* the only words: small and quiet (Henry, 20:01: "less words are better") */
.mlanding .lquiet{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.82}
.mlanding .llabel{margin:0;font-family:var(--note);font-weight:700;font-size:17px;color:#8A6A88;letter-spacing:.02em}
.mlanding .lscene{position:relative;display:flex;justify-content:center}
.mlanding .lscene .ibox{margin:0;cursor:pointer}
.mlanding .lpics{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap;max-width:100%}
.mlanding .lpic{display:inline-flex;align-items:center;gap:6px;flex:none}
.mlanding .lshare{width:26px;height:30px;padding:3px 4px;border-radius:8px;background:#FFFDF8;box-shadow:0 0 0 1.6px #8A6A88}
.mlanding .lshare svg{width:100%;height:100%;overflow:visible}
.mlanding .lrow{padding:4px 8px;border-radius:8px;background:#F6E4EA;box-shadow:0 0 0 1.6px #8A6A88;font-family:var(--read);font-weight:400;font-size:13px;color:#4E3350;white-space:nowrap}
.mlanding .addmark{width:16px;height:16px;flex:none}
.mlanding .licon{flex-direction:column;gap:2px;font-size:12px;color:#4E3350}
.mlanding .licon img{width:40px;height:40px;border-radius:10px;box-shadow:0 0 0 2px #2F2A27;display:block}
.mlanding .larrow{width:24px;height:14px;flex:none}
.mlanding .lhelp{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:52px;height:52px;display:grid;place-items:center}
.mlanding .lhelp svg{width:44px;height:44px;overflow:visible}
.mlanding .lsteps{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:calc(max(12px,env(safe-area-inset-bottom)) + 58px);max-width:min(380px,calc(100vw - 24px));padding:12px 16px 10px 10px;background:#F1DCE2;color:#4E3350;border-radius:8px 12px 9px 14px;transform:rotate(-.8deg);box-shadow:3px 4px 0 rgba(42,36,38,.35);font-size:19px;line-height:1.2;z-index:3}
.mlanding .lsteps ol{margin:0;padding-left:26px}.mlanding .lsteps li{margin:0 0 6px}.mlanding .lsteps p{margin:4px 0 0 6px;font-size:17px;color:#6B4A68}
.mlanding .lsteps .share,.mlanding .lsteps .addmark{display:inline-block;width:.9em;height:1em;vertical-align:-.12em}
.mlanding .lsteps .x{position:absolute;right:0;top:0;width:44px;height:44px;font-size:22px;color:#9C3A72}
.mlanding .linstall{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:84px}
.mlanding .linstall svg{width:84px;height:84px;overflow:visible}
@media (orientation:landscape){.mlanding{justify-content:center;gap:4vh;padding-bottom:max(12px,env(safe-area-inset-bottom))}}
/* (Nov 17, the front door) on an iPad the quiet words were phone sized (17 and 13 px on a 1180 px page): readable through size, still quiet */
@media (min-width:900px) and (min-height:700px){.mlanding .llabel{font-size:23px}.mlanding .lrow{font-size:17px;padding:6px 11px}.mlanding .addmark{width:20px;height:20px}.mlanding .lshare{width:34px;height:40px}.mlanding .larrow{width:30px;height:17px}.mlanding .lpics{gap:9px}.mlanding .lhelp{width:64px;height:64px}.mlanding .lhelp svg{width:54px;height:54px}}
/* the jar perched on the piano (the opening and the landing): tipped up on an edge, still. It never wobbles by itself:
   only when you play (Henry, 21:44). The opening: each note rocks it a bit more (.rock1, .rock2) and a few notes knock it over */
.ijar.perch{transform:rotate(-8deg)}
.ijar.rock1{animation:rock1 .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes rock1{25%{transform:rotate(-14deg)}60%{transform:rotate(-5deg)}100%{transform:rotate(-8deg)}}
.ijar.rock2{animation:rock2 .6s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes rock2{25%{transform:rotate(-20deg)}55%{transform:rotate(-6deg)}100%{transform:rotate(-12deg)}}
/* the butter knife standing in the jam, its handle out over the rim; a touch tips it a little (the landing) */
.ijar .iknife{position:absolute;right:46%;top:22%;width:120%;height:24%;transform-origin:100% 50%;transform:rotate(118deg);z-index:-1}
.ijar .iknife svg{width:100%;height:100%;display:block;overflow:visible}
.ijar .iknife.tip{animation:ktip .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes ktip{30%{transform:rotate(132deg)}100%{transform:rotate(118deg)}}
.ijar.nudge{animation:nudge .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes nudge{25%{transform:rotate(-15deg)}55%{transform:rotate(-4deg)}100%{transform:rotate(-8deg)}}

/* ?buzz (retired in round 8; this comment stays: it ends the landing block that tools/opening-css.mjs lifts into the iPad page) */
</style>
</head>
<body>
<div id="room" class="mroom" aria-hidden="true"></div>
<div id="app" class="m">
  <header class="mtop">
    <button type="button" id="play" class="mplay" aria-label="play"></button>
    <div class="msong">
      <button type="button" id="songBtn" class="word mpick" aria-haspopup="listbox" aria-label="pick a song"><span id="songName">Onion Soup</span><span id="songCaret" class="caret"></span></button>
      <div class="mchord"><b id="chordNow"></b><span id="chordNext"></span></div>
    </div>
    <div class="mriffrow">
      <div class="mriff"><span class="rword">riff</span><div class="rpick"><nav id="riffs" class="mriffs" aria-label="the riffs: A, B, C and jam"></nav><div id="riffSlide" class="mslide" role="slider" aria-label="pick a riff" tabindex="0"></div></div>
        <button type="button" id="ladder" class="ladder" aria-label="the riff's level: 1, 2 or 3 (tap a rung)"></button></div>
      <div class="mexp"><span class="ew">expand</span><div id="lenSlide" class="mslide" role="slider" aria-label="expand the riff: 1, 2 or 4 bars" tabindex="0"></div><span class="lstops"><span>1 bar</span><span>2</span><span>4</span></span></div>
    </div>
    <button type="button" id="help" class="mhelp" aria-label="help: the tips" aria-expanded="false"></button>
    <button type="button" id="rec" class="mrec" aria-label="keep the jam"></button>
  </header>
  <div id="scene" class="mscene" aria-label="the band on stage"><canvas aria-hidden="true"></canvas><div class="schord" aria-live="off"><b id="sChordNow"></b><span id="sChordNext"></span></div></div>
  <div class="mline"><span id="say" class="say"></span><span id="nod" class="nod"></span><span id="lat" class="lat"></span><button type="button" id="fs" class="mfs" aria-label="full screen" hidden></button></div>
  <div class="mbody">
    <div class="hands" role="group" aria-label="the hands"><button type="button" class="word small" data-hand="left" aria-pressed="false">left</button><button type="button" class="word small" data-hand="right" aria-pressed="true">right</button></div>
    <div class="keys"><canvas id="kb" aria-label="the keys: play with your fingers"></canvas></div>
    <aside class="mside" aria-label="the band">
      <div class="lamps"><button type="button" id="lamp-drums" class="lamp" data-rat="lamp-drums"></button><button type="button" id="lamp-bass" class="lamp" data-rat="lamp-bass"></button></div>
      <div class="knobrow"><button type="button" id="knob" class="knob" aria-label="the groove: tap the right side for more, the left for less"><span id="knobDn" class="karrow dn" aria-hidden="true"></span><span id="knobDial" class="kdial"></span><span id="knobUp" class="karrow up" aria-hidden="true"></span><span id="knobWord" class="kword"></span></button></div>
      <div id="sour" class="sour" role="slider" aria-label="sour notes" aria-valuemin="0" aria-valuemax="2" tabindex="0"><span class="sw">sour notes</span><span class="strack"></span><span class="sstops"><span>ring</span><span>soft</span><span>silent</span></span></div>
      <button type="button" id="out" class="mout" aria-pressed="false" aria-label="iPhone speaker or headphones and speakers"><span class="otrack"></span></button>
    </aside>
  </div>
  <div id="songList" class="mlist" hidden></div>
  <div id="tips" class="mtips" hidden role="dialog" aria-label="tips"></div>
  <div id="jarPop" class="jarpop" hidden>
    <div class="jarArt"></div>
    <p class="jarSecs"></p>
    <audio preload="auto" playsinline></audio>
    <div class="jarBtns"><button type="button" id="jarListen" class="word small">listen</button><button type="button" id="jarShare" class="word small">share or save</button><button type="button" id="jarX" class="word small">×</button></div>
  </div>
  <div id="start" class="mstart">
    <div id="startLogo" class="slogo" role="img" aria-label="à la jam"></div>
    <button type="button" id="bigPlay" class="bigplay" aria-label="play"></button>
    <p id="loading" class="loading">the band is setting up…</p>
  </div>
  <div id="intro" class="mintro"></div>
  <div id="landing" class="mlanding" hidden></div>
  <div id="sketch" class="msketch" aria-hidden="true"></div>
  <p id="hint" class="mhint" hidden></p>

look: around \xB7 at suit \xB7 at you
nod: 1

scene: drums
hop to: part-drums
toggle off and on: part-drums     (oh okay)

scene: bass
toggle off and on: part-bass      (cool)

scene: chords
toggle off and on: part-keys      (yeah)
shrug: at part-lead               # the riffs are off already

scene: metronome
walk to: metro

watch: metro-big, tap foot 2 bars, nod 2   (whoa)
press: metro-big                  # puts it away

scene: the plate
walk to: plate-fold
press: plate-fold                  # the minus: the pink plate folds up
ride: calm-plate down             # and he drops to the scale knob below
look: at you                      (oh okay)
press: calm-lip                   # "tap to bring it back"
ride: calm-plate up               # it unfolds and he bounces back up on it
nod: 1

scene: hands
press: tab-left                   (hm)
press: tab-right                  (oh okay)
press: tab-both                   (cool)

scene: practice modes
wire to: toggle-noteNames
press: toggle-noteNames           (leave it)   # note names on, and he leaves them on (Henry, Nov 13 09:14: the practice modes stay on)
nod: 1

scene: off
exit: stage left

trade: turns with you
