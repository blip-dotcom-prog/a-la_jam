<meta name="apple-mobile-web-app-capable" content="yes">

<title>à la jam · pocket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Londrina+Solid:wght@300;400;900&family=Lexend:wght@300;400;600&display=swap">
<style>/* à la jam on a phone (docs/MOBILE.md): the same plum paper, pencil and paper tabs as the desktop (web/style.css), for
   fingers, in landscape. Nothing on this page scrolls, zooms, selects or long-presses. */
:root{color-scheme:dark;--ground:#3B1D47;--ground2:#2C1336;--ink:#F7E9D7;--ink-soft:#D9B9D9;--pink:#EE6FA8;--gold:#E0A12E;--teal:#2A8794;--cream:#FBF3E1;--graphite:#2F2A27;
  --display:"Londrina Solid","Arial Narrow",Impact,sans-serif;--note:"Caveat","Comic Sans MS",cursive;--read:"Lexend",Verdana,sans-serif;--k:1}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0}
body{background:var(--ground);color:var(--ink);font-family:var(--read);font-weight:300;
  background-image:var(--fibre),radial-gradient(120% 90% at 50% 0%,rgba(238,111,168,.12),transparent 55%,rgba(10,0,20,.45) 100%);background-size:420px 420px,100% 100%}
*{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus{outline:none}:focus-visible{outline:2px solid rgba(224,161,46,.7);outline-offset:4px;border-radius:40% 55% 45% 60%}
[hidden]{display:none!important}
.m{height:100%;display:grid;grid-template-rows:auto 26px minmax(0,1fr);position:relative;
  padding:max(6px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(4px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

/* the paper tabs (web/style.css .word, the same drawing: ui/art.js underline) */
.word{font-family:var(--display);font-size:24px;letter-spacing:.03em;line-height:1.1;padding:5px 14px 9px;position:relative;isolation:isolate;color:#4E3350;
  display:inline-block;white-space:nowrap;--tab:#C9A3BD;--tabOn:#F3D9E2;--tabInk:#2A1233;transition:transform .08s}
.word .tabbg,.word .tabink{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible;pointer-events:none}
.word .tabbg{transform:translate(2.2px,1.8px);filter:drop-shadow(1.6px 2.6px 0 rgba(18,0,26,.42))}
.word .tabbg .tpa{fill:var(--tab);stroke:none}
.word .tabink path{fill:none;stroke:var(--tabInk);stroke-linejoin:round}
.word .tabink .tpi{stroke-width:1.5}.word .tabink .tpb{stroke-width:.8;opacity:.5}
.word[aria-pressed="true"] .tpa{fill:var(--tabOn)}
.word[aria-pressed="true"]{color:#3A1F45}
.word:active{transform:translate(1.2px,2.2px)}
.word .ul{position:absolute;left:9px;bottom:2px;width:calc(100% - 18px);height:12px;overflow:visible;pointer-events:none;clip-path:inset(0 101% 0 0);transition:clip-path .4s cubic-bezier(.3,.7,.3,1)}
.word .ul path{fill:none;stroke-linecap:round}
.word[aria-pressed="true"] .ul{clip-path:inset(0 0 0 0)}

/* the top: play · the song and its chord · the riffs · more · the lemon and one-key chords */
.mtop{display:flex;align-items:center;gap:clamp(6px,1.4vw,14px);min-height:64px;position:relative;z-index:3}
.mplay{width:56px;height:56px;flex:none;display:grid;place-items:center}
.mplay svg{width:56px;height:56px;overflow:visible}
.mplay:active{transform:translate(1px,2px)}
.msong{display:flex;flex-direction:column;min-width:0;flex:0 1 auto;line-height:1}
/* the song picker: the song's name on a paper tab, a pencil arrow on it (round 2, Henry: "make it obvious") */
.word.mpick{display:inline-flex;align-items:center;gap:6px;font-size:clamp(18px,5vh,23px);padding:3px 12px 7px;align-self:flex-start;transform:rotate(-1.5deg)}
.mpick .caret svg{width:17px;height:13px;display:block;margin-top:4px}
.mchord{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.mchord b{font-family:var(--display);font-weight:400;font-size:clamp(28px,5.2vh,40px);color:var(--cream);letter-spacing:.02em;display:inline-block}
.mchord b.flip{animation:flip .22s ease-out}
@keyframes flip{from{transform:translateY(4px) rotate(-3deg);opacity:.4}to{transform:none;opacity:1}}
.mchord span{font-family:var(--note);font-size:20px;color:var(--ink-soft);opacity:.8}
/* riff: the word, and big handwritten numbers (1 2 3 · jam), the one up glowing */
.mriff{display:flex;align-items:center;gap:clamp(6px,1.2vw,12px);flex:1 1 auto;justify-content:center;min-width:0}
.rword{font-family:var(--display);font-size:clamp(24px,6.4vh,32px);color:var(--cream);transform:rotate(-3deg);letter-spacing:.02em}
.mriffs{display:flex;gap:clamp(2px,.8vw,8px)}
.jarl{width:clamp(34px,10vh,46px);height:clamp(38px,11vh,50px)}
.jarl[data-w="jam"]{width:clamp(40px,12vh,54px)}
.jarl svg{width:100%;height:100%;overflow:visible;display:block}
.jarl:active{transform:translateY(2px)}
/* the jars over their slider; the level ladder; expand: a rugged slider, 1 bar · 2 · 4 */
.rpick{display:flex;flex-direction:column;align-items:stretch;gap:0}
.mslide{height:24px;min-width:110px;touch-action:none;cursor:pointer}
.mslide svg{display:block;width:100%}
.rpick .mslide{margin:-2px 4px 0}
.ladder{width:26px;height:44px;flex:none;transition:opacity .3s}
.ladder svg{width:100%;height:100%;overflow:visible}
.ladder.faint{opacity:.35}
.mexp{flex:none;display:flex;flex-direction:column;align-items:stretch;width:clamp(104px,15vw,140px)}
.mexp .ew{text-align:center;line-height:1}
.lstops{display:flex;justify-content:space-between;font-family:var(--note);font-weight:700;font-size:14px;line-height:1;color:var(--ink-soft);padding:0 2px}
.lmid{display:flex;flex-direction:column;align-items:center;line-height:.95}
.lword{font-family:var(--display);font-size:clamp(17px,4.8vh,21px);color:var(--cream);white-space:nowrap}
.ew{font-family:var(--note);font-weight:700;font-size:15px;color:var(--ink-soft)}
.mmore{flex:none;display:flex;flex-direction:column;align-items:center;width:52px;font-family:var(--note);font-weight:700;font-size:17px;line-height:.9;color:#FBE3EE;transition:opacity .3s}
.mmore svg{width:34px;height:34px}
.mmore.faint{opacity:.35}
.mmore:active{transform:translateY(2px)}
/* keep: one button (a pencil dot) */
.mrec{flex:none;display:flex;flex-direction:column;align-items:center;width:52px;font-family:var(--note);font-weight:700;font-size:16px;line-height:.9;color:#FBE3EE}
.mrec svg{width:38px;height:38px;overflow:visible}
.mrec.on svg{animation:recpulse 1s ease-in-out infinite}
@keyframes recpulse{50%{transform:scale(.9)}}

/* the pencil line: the riff's say-it words, the band's words */
.mline{display:flex;align-items:center;justify-content:center;gap:18px;font-family:var(--note);font-size:22px;line-height:1;white-space:nowrap;overflow:hidden}
.say{color:#FBE3EE;letter-spacing:.02em}
.nod{color:var(--pink);font-weight:700;transform:rotate(-2deg);opacity:0;transition:opacity .5s}
.nod.on{opacity:1}
.lat{font-size:14px;color:var(--ink-soft);opacity:.7}

/* the body: the keys (one octave, big) and the side (hands, lamps, the groove knob, the lemon, the speaker) */
.mbody{display:grid;grid-template-columns:minmax(0,1fr) clamp(132px,19vw,190px);gap:clamp(8px,1.6vw,16px);min-height:0}
.keys{position:relative;min-height:0;contain:strict}
.keys canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;will-change:transform}
.mside{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:2px;min-height:0;padding-bottom:2px}
.hands{display:flex;gap:6px}
.hands .word{font-size:clamp(17px,4.6vh,22px);padding:4px 11px 8px}
.lamps{display:flex;gap:clamp(6px,1.4vw,14px)}
.lamp{display:flex;flex-direction:column;align-items:center;font-family:var(--note);font-weight:700;font-size:15px;line-height:.9;color:var(--ink-soft)}
.lamp svg{width:clamp(36px,10.5vh,50px);height:clamp(40px,11.6vh,55px);overflow:visible}
.lamp[aria-pressed="false"]{opacity:.75}
.lamp:active,.mtog:active,.mout:active{transform:translateY(2px)}
.knobrow{display:flex;align-items:center;gap:0}
.karrow svg{width:22px;height:26px;opacity:.75}
.knob{display:flex;flex-direction:column;align-items:center}
.kdial svg{width:clamp(56px,19vh,82px);height:clamp(56px,19vh,82px);overflow:visible;display:block}
.knob:active .kdial svg{transform:rotate(-4deg)}
.kword{font-family:var(--note);font-weight:700;font-size:17px;line-height:.9;color:#FBE3EE;margin-top:-2px}
/* sour notes: a pencil slider, three stops (ring · soft · silent); slide it or tap a stop */
.sour{display:flex;flex-direction:column;align-items:stretch;width:100%;max-width:170px;margin-top:4px;touch-action:none;cursor:pointer}
.sour .sw{font-family:var(--note);font-weight:700;font-size:16px;line-height:1;color:var(--ink-soft);text-align:center}
.sour .strack{display:block;height:32px}
.sour .strack svg{display:block;width:100%}
.sour .sstops{display:flex;justify-content:space-between;font-family:var(--note);font-weight:700;font-size:14px;line-height:1;color:var(--ink-soft);opacity:.75;padding:0 2px}
.sour .sstops .on{color:#FBE3EE;opacity:1}
.mtogs{display:flex;gap:4px;align-items:flex-end}
.mtog{display:flex;flex-direction:column;align-items:center;min-width:52px;font-family:var(--note);font-weight:700;font-size:14px;line-height:1;color:var(--ink-soft)}
.mtog svg{width:36px;height:30px}
.mout{font-family:var(--note);font-weight:700;font-size:15px;line-height:1;color:var(--ink-soft);padding:2px 6px;border-bottom:2px dashed rgba(217,185,217,.4);text-align:center;white-space:nowrap}
.mout[aria-pressed="true"]{color:#FBE3EE;border-bottom-color:#EE6FA8}

/* the slide hint: a pencil finger on a dotted path over the keys */
.slidehint{position:absolute;inset:0;pointer-events:none;z-index:4;transition:opacity .8s}
.slidehint.gone{opacity:0}
.slidehint .hpath{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.slidehint .hfinger{position:absolute;left:0;top:0;width:46px;height:48px;offset-rotate:0deg;offset-anchor:30% 6%;animation:trace 3.2s ease-in-out infinite}
.slidehint .hfinger svg{width:100%;height:100%;filter:drop-shadow(2px 3px 0 rgba(18,0,26,.4))}
.slidehint .hword{position:absolute;right:10px;top:6px;font-family:var(--note);font-weight:700;font-size:21px;color:#FBE3EE;transform:rotate(-3deg);text-shadow:1px 2px 0 rgba(18,0,26,.6)}
@keyframes trace{0%{offset-distance:0%;opacity:0}8%{opacity:1}80%{offset-distance:100%;opacity:1}100%{offset-distance:100%;opacity:0}}

/* the rat's line by a control */
.mbubble{position:fixed;z-index:50;padding:5px 12px 7px;background:#FBF3E1;color:#4E3350;font-family:var(--note);font-weight:700;font-size:20px;border-radius:10px 14px 12px 6px;box-shadow:2px 3px 0 rgba(18,0,26,.45);transform:rotate(-2deg);white-space:nowrap;transition:opacity .8s;pointer-events:none}
.mbubble.gone{opacity:0}

/* the kept take: a little jar */
.jarpop{position:absolute;z-index:45;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1deg);display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 18px 14px;
  background:#F1DCE2;color:#4E3350;border-radius:10px 16px 12px 18px;box-shadow:4px 5px 0 rgba(18,0,26,.5)}
.jarpop .jarArt svg{width:96px;height:96px;overflow:visible}
.jarpop .jarSecs{margin:0;font-family:var(--note);font-weight:700;font-size:19px}
.jarpop audio{display:none}
.jarBtns{display:flex;gap:8px}
.jarpop .word{--tab:#FBF3E1;--tabOn:#FFF6F6;--tabInk:#17707A}

/* the song picker: a scrap of paper that drops down */
.mlist{position:absolute;z-index:20;top:62px;left:76px;padding:14px 18px 12px;background:#F1DCE2;color:#4E3350;border-radius:6px 10px 8px 12px;transform:rotate(-1deg);
  box-shadow:3px 4px 0 rgba(18,0,26,.45);display:flex;flex-direction:column;align-items:flex-start;gap:4px;max-height:70vh;overflow:auto;touch-action:pan-y}
.mlist .word{--tab:#FBF3E1;--tabOn:#FFF6F6;--tabInk:#17707A;font-size:24px}
.mlist .blurb{margin:0 0 6px 6px;font-family:var(--note);font-size:17px;color:#6B4A68}
.mlist .soon{margin:4px 0 0 6px;font-family:var(--note);font-size:18px;color:#9C3A72}

/* the start: one big play button */
.mstart{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:var(--ground);background-image:var(--fibre),radial-gradient(70% 70% at 50% 45%,rgba(238,111,168,.18),transparent 70%);background-size:420px 420px,100% 100%;transition:opacity .6s,visibility .6s}
.begun .mstart{opacity:0;visibility:hidden;pointer-events:none}
.kicker{margin:0;font-family:var(--note);font-size:24px;color:var(--ink-soft);transform:rotate(-3deg)}
.title{margin:0 0 4px;font-family:var(--display);font-weight:900;font-size:clamp(40px,11vh,64px);letter-spacing:.02em;color:var(--cream);transform:rotate(-1.5deg);text-shadow:3px 3px 0 rgba(18,0,26,.5)}
.bigplay{width:min(168px,40vh);height:min(168px,40vh);animation:breathe 2.4s ease-in-out infinite}
.bigplay svg{width:100%;height:100%;overflow:visible}
.bigplay:active{transform:scale(.96) translate(2px,3px);animation:none}
@keyframes breathe{50%{transform:scale(1.04) rotate(-1.5deg)}}
.under{margin:6px 0 0;font-family:var(--note);font-size:21px;color:var(--ink-soft)}
.loading{margin:0;font-family:var(--note);font-size:17px;color:var(--pink);min-height:1.2em}

/* portrait: the rat points, "turn me sideways" */
.mturn{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--ground);
  background-image:var(--fibre),radial-gradient(80% 60% at 50% 40%,rgba(238,111,168,.16),transparent 70%);background-size:420px 420px,100% 100%;padding:24px}
.mturn canvas{width:min(80vw,340px);height:min(52vh,420px)}
.mturn .tarrow{width:110px;height:110px;margin-top:-30px;animation:spin 2.8s ease-in-out infinite}
.mturn p{margin:0;font-family:var(--display);font-size:clamp(34px,9vw,48px);color:var(--cream);transform:rotate(-3deg);letter-spacing:.02em;text-shadow:3px 3px 0 rgba(18,0,26,.5)}
@keyframes spin{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}

/* no sound? */
.mhint{position:absolute;z-index:25;left:50%;top:68px;transform:translateX(-50%) rotate(-2deg);margin:0;padding:6px 14px 8px;background:#F1DCE2;color:#9C3A72;
  font-family:var(--note);font-weight:700;font-size:20px;border-radius:8px 12px 9px 13px;box-shadow:2px 3px 0 rgba(18,0,26,.45);transition:opacity 1.2s;white-space:nowrap}
.mhint.gone{opacity:0}

/* the rat's stage canvas is see-through to touches (a finger on him plays the key under him) */
.ratstage{pointer-events:none;will-change:transform}
.rathit{pointer-events:none!important}

/* smaller phones */
@media (max-width:720px){.mchord span{display:none}.mrec{width:42px}.rword{font-size:22px}}
@media (max-height:340px){.m{grid-template-rows:auto 20px minmax(0,1fr)}.mline{font-size:18px}.mplay,.mplay svg{width:48px;height:48px}}
@media (prefers-reduced-motion:reduce){.slidehint .hfinger,.mrec.on svg{animation:none}.bigplay,.mturn .tarrow{animation:none}.mchord b.flip{animation:none}}
</style>
</head>
<body>
<div id="app" class="m">
  <header class="mtop">
    <button type="button" id="play" class="mplay" aria-label="play"></button>
    <div class="msong">
      <button type="button" id="songBtn" class="word mpick" aria-haspopup="listbox" aria-label="pick a song"><span id="songName">Onion Soup</span><span id="songCaret" class="caret"></span></button>
      <div class="mchord"><b id="chordNow"></b><span id="chordNext"></span></div>
    </div>
    <div class="mriff"><span class="rword">riff</span><div class="rpick"><nav id="riffs" class="mriffs" aria-label="the riffs: 1, 2, 3 and jam"></nav><div id="riffSlide" class="mslide" role="slider" aria-label="pick a riff" tabindex="0"></div></div>
      <button type="button" id="ladder" class="ladder" aria-label="the riff's level: 1, 2 or 3 (tap a rung)"></button></div>
    <div class="mexp"><span class="ew">expand</span><div id="lenSlide" class="mslide" role="slider" aria-label="expand the riff: 1, 2 or 4 bars" tabindex="0"></div><span class="lstops"><span>1 bar</span><span>2</span><span>4</span></span></div>
    <button type="button" id="rec" class="mrec" aria-label="keep the jam"></button>
  </header>
  <div class="mline"><span id="say" class="say"></span><span id="nod" class="nod"></span><span id="lat" class="lat"></span></div>
  <div class="mbody">
    <div class="keys"><canvas id="kb" aria-label="the keys: play with your fingers"></canvas><div id="slideHint" class="slidehint" hidden></div></div>
    <aside class="mside" aria-label="the band">
      <div class="hands"><button type="button" class="word small" data-hand="left" aria-pressed="false">left</button><button type="button" class="word small" data-hand="right" aria-pressed="true">right</button></div>
      <div class="lamps"><button type="button" id="lamp-drums" class="lamp" data-rat="lamp-drums"></button><button type="button" id="lamp-bass" class="lamp" data-rat="lamp-bass"></button></div>
      <div class="knobrow"><span id="knobDn" class="karrow" aria-hidden="true"></span><button type="button" id="knob" class="knob" aria-label="the groove: tap the right side for more, the left for less"><span id="knobDial" class="kdial"></span><span id="knobWord" class="kword"></span></button><span id="knobUp" class="karrow" aria-hidden="true"></span></div>
      <div id="sour" class="sour" role="slider" aria-label="sour notes" aria-valuemin="0" aria-valuemax="2" tabindex="0"><span class="sw">sour notes</span><span class="strack"></span><span class="sstops"><span>ring</span><span>soft</span><span>silent</span></span></div>
      <button type="button" id="out" class="mout" aria-pressed="false"></button>
    </aside>
  </div>
  <div id="songList" class="mlist" hidden></div>
  <div id="jarPop" class="jarpop" hidden>
    <div class="jarArt"></div>
    <p class="jarSecs"></p>
    <audio preload="auto" playsinline></audio>
    <div class="jarBtns"><button type="button" id="jarListen" class="word small">listen</button><button type="button" id="jarShare" class="word small">share or save</button><button type="button" id="jarX" class="word small">×</button></div>
  </div>
  <div id="start" class="mstart">
    <p class="kicker">à la jam</p>
    <h1 class="title">Onion Soup</h1>
    <button type="button" id="bigPlay" class="bigplay" aria-label="play"></button>
    <p class="under">tap and the band starts · then play along on the keys</p>
    <p id="loading" class="loading">the band is setting up…</p>
  </div>
  <div id="turn" class="mturn" hidden>
    <canvas id="turnRat" aria-hidden="true"></canvas>
    <div id="turnArrow" class="tarrow" aria-hidden="true"></div>
    <p>turn me sideways</p>
  </div>
  <p id="hint" class="mhint" hidden></p>

# a jazz guy: cool, on the beat, not excited about anything. "yeah, what's this? oh, okay, cool."
# one step a line. lines starting with # are notes. see SCRIPT.md for the words he knows.

scene: wake
wake on: jar
look: around \xB7 at suit \xB7 at you
nod: 1

scene: drums
hop to: part-drums
toggle off and on: part-drums     (oh okay)

scene: bass
toggle off and on: part-bass      (cool)

scene: chords
toggle off and on: part-keys      (yeah)
shrug: at part-lead               # the riffs are off already

scene: metronome
walk to: metro
press: metro                      # the big metronome comes up
watch: metro-big, tap foot 2 bars, nod 2   (whoa)
press: metro-big                  # puts it away

scene: the plate
walk to: plate-fold
press: plate-fold                  # the minus: the pink plate folds up
ride: calm-plate down             # and he drops to the scale knob below
look: at you                      (oh okay)
press: calm-lip                   # "tap to bring it back"
ride: calm-plate up               # it unfolds and he bounces back up on it
nod: 1

scene: hands
press: tab-left                   (hm)
press: tab-right                  (oh okay)
press: tab-both                   (cool)

scene: practice modes
wire to: toggle-noteNames
press: toggle-noteNames           (leave it)   # note names on, and he leaves them on (Henry, Nov 13 09:14: the practice modes stay on)
nod: 1

scene: off
exit: stage left
`;var Ph=`# the paint visit: now and then he comes up just over the keys to dig your painting.
come up at: paint-line
look: up at paint \xB7 at you
tap foot: 1 bar
jazzy: 1 bar
nod: 2                            (cool)
exit: nearest side
`;var $h=`# the AV cart: when the sound needs looking at, he rolls out from behind the sound tab like the sound guy at a show.
roll out from: sound
fiddle: 2 beats
listen: 2 beats                   # an ear to the room
fix it                            # whatever brought him (the sound asleep, a sample)
fiddle: 1 beat
nod: 2
exit: stage left                  # rolls off
`;var Nh=`# riff mode's "show me" (the right hand's riffs): he walks out along the bottom of the keys with his olive mallets and
# taps the riff two or three times over, in time with the band (each key sounds and lights as he taps it; his tail gets
# a low landing). Then your turn: he stands right by the riff's keys (never on them) and vibes it out on the beat: a head
# bob, a toe tap, a snap on 2 and 4, a clap on the band's claps (no sitting, Henry). Then he steps straight back in for
# his next turn, and you trade turns like that while the riff is up. Put the riff away and he has a bar of a dance and
# walks off. Small, calm, on the beat (Nov 14, Henry: smooth moves, close by, no dancing mid-trade, no sitting).
walk in: under keys
play riff: current
sit: by the riff
trade: turns with you
dance: any 1 bar
exit: nearest side
`;var Hh=`# the test bench's postcards ("the rat says stuff here and there", src/bench): after you stop playing, now and then
# (one a visit at most), he walks in, looks about, tapes a postcard up over the plate and leaves you to read it.
# He never talks: the card does. Never while you play.
walk to: postcard
look: at postcard                 (hm)
tape up: postcard
look: at you                      (oh okay)
nod: 1
exit: nearest side
`;var Vh=`# the slow dance (Nov 14, Henry): when no riff is up and the band is just grooving on bossa, the lounge, a slow tune or
# a waltz, now and then he walks in under the keys, dances two to four bars with his partner (her hand held up, his arm
# round her waist, a sway, a slow turn), and walks off. Never while you're trading riffs; it ends when you play.
walk in: under keys
