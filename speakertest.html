<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speaker Test</title>
<style>
:root{--bg:#3B1D47;--card:#FBF3E1;--ink:#2F2A27;--pink:#EE6FA8;--dim:#C9B6C8}
body{margin:0;background:var(--bg);color:var(--card);font:17px/1.35 -apple-system,system-ui,sans-serif;padding:16px 16px 40px}
h1{font-size:22px;margin:4px 0 4px}p{margin:4px 0 12px;color:var(--dim)}
button{display:block;width:100%;text-align:left;margin:8px 0;padding:14px 16px;border:0;border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-weight:600}
button small{display:block;font-weight:400;color:#6B4A68;margin-top:2px}
button.on{background:var(--pink);color:#fff}button.on small{color:#fff}
#stop{background:#222;color:#fff;text-align:center;position:sticky;top:8px;z-index:2}
#info{font:13px ui-monospace,monospace;color:var(--dim);white-space:pre-wrap;margin-top:12px}
.sec{margin-top:18px;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--dim)}
</style></head><body>
<h1>à la jam · speaker test</h1>
<p>Phone speaker, volume about halfway. Tap one at a time and listen for the buzz or crackle. Tell Claude the first number that buzzes.</p>
<button id="stop">■ stop</button>
<div class="sec">plain tones</div>
<button data-t="1">1 · a plain tone<small>one smooth beep (A 440)</small></button>
<button data-t="2">2 · a low-ish tone<small>a smooth hum (A 220)</small></button>
<div class="sec">our real sounds, nothing added</div>
<button data-t="3">3 · one Rhodes note, plain audio player<small>no Web Audio at all</small></button>
<button data-t="4">4 · one Rhodes note, Web Audio<small>the same note, the app's way</small></button>
<button data-t="5">5 · a Rhodes chord, Web Audio<small>three notes ringing</small></button>
<button data-t="6">6 · the warm bass, Web Audio</button>
<button data-t="7">7 · a little groove<small>Rhodes + bass + drum, looping</small></button>
<div class="sec">the app's extra machinery</div>
<button data-t="8">8 · the groove + a compressor (built-in)</button>
<button data-t="9">9 · the groove + a worklet<small>the custom audio code the app uses</small></button>
<button data-t="10">10 · the groove + the silent-switch audio trick</button>
<div class="sec">the real app</div>
<button data-t="11">11 · open the phone app<small>for comparison</small></button>
<div id="info"></div>
<script>
const S='samples/';let ctx=null,nodes=[],timers=[],el=null;const info=document.getElementById('info');
function show(x){info.textContent=x}
function getCtx(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();}return ctx}
function stat(){if(!ctx)return'';return `sample rate ${ctx.sampleRate}\nbase latency ${(ctx.baseLatency||0).toFixed(4)}\noutput latency ${(ctx.outputLatency||0).toFixed(4)}\nstate ${ctx.state}\n${navigator.userAgent}`}
function stop(){timers.forEach(clearInterval);timers=[];nodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){}try{n.disconnect()}catch(e){}});nodes=[];if(el){el.pause();el.src='';el=null}document.querySelectorAll('button.on').forEach(b=>b.classList.remove('on'))}
const cache={};async function load(p){if(cache[p])return cache[p];const r=await fetch(S+p);const a=await r.arrayBuffer();return cache[p]=await getCtx().decodeAudioData(a)}
function out(){const c=getCtx(),g=c.createGain();g.gain.value=.5;g.connect(c.destination);nodes.push(g);return g}
function play(buf,dest,when,gain=1,dur){const c=getCtx(),s=c.createBufferSource();s.buffer=buf;const g=c.createGain();g.gain.value=gain;s.connect(g);g.connect(dest);s.start(when);if(dur)s.stop(when+dur);nodes.push(s,g);return s}
async function groove(dest){const c=getCtx();const [r1,r2,r3,b,k]=await Promise.all(['rhodes/l3/D3.mp3','rhodes/l3/A2.mp3','rhodes/l3/D4.mp3','warmbass/mf/B1_1.mp3',KICK].map(load));
  let t=c.currentTime+.1;const beat=60/118;
  const bar=()=>{for(let i=0;i<4;i++){play(k,dest,t+i*beat,.9,.4);}play(b,dest,t,.8,beat*2);play(b,dest,t+beat*2,.8,beat*2);[r1,r2,r3].forEach(x=>play(x,dest,t,.35,beat*4));t+=beat*4};
  bar();bar();timers.push(setInterval(()=>{while(t<c.currentTime+2*beat*4)bar()},500))}
let KICK='kit/kick_v1_1.mp3';
async function worklet(c){const code=`class P extends AudioWorkletProcessor{process(i,o){const a=i[0],b=o[0];for(let ch=0;ch<b.length;ch++){if(a[ch])b[ch].set(a[ch])}return true}}registerProcessor('pass',P)`;
  await c.audioWorklet.addModule(URL.createObjectURL(new Blob([code],{type:'application/javascript'})));return new AudioWorkletNode(c,'pass',{outputChannelCount:[2]})}
async function run(t){stop();const c=t==3||t==11?null:getCtx();if(c&&c.state!=='running')await c.resume();
  if(t==1||t==2){const o=c.createOscillator(),g=c.createGain();o.frequency.value=t==1?440:220;g.gain.value=.25;o.connect(g);g.connect(out());o.start();nodes.push(o,g)}
  if(t==3){el=new Audio(S+'rhodes/l3/D4.mp3');el.loop=true;el.play()}
  if(t==4){const b=await load('rhodes/l3/D4.mp3');const d=out();const go=()=>play(b,d,getCtx().currentTime+.02,.9,2.2);go();timers.push(setInterval(go,2400))}
  if(t==5){const bs=await Promise.all(['rhodes/l3/D3.mp3','rhodes/l3/A2.mp3','rhodes/l3/D4.mp3'].map(load));const d=out();const go=()=>bs.forEach(b=>play(b,d,getCtx().currentTime+.02,.5,2.2));go();timers.push(setInterval(go,2400))}
  if(t==6){const b=await load('warmbass/mf/B1_1.mp3');const d=out();const go=()=>play(b,d,getCtx().currentTime+.02,.9,1.2);go();timers.push(setInterval(go,1400))}
  if(t==7)await groove(out());
  if(t==8){const k=c.createDynamicsCompressor();k.threshold.value=-18;k.ratio.value=3;k.connect(out());nodes.push(k);await groove(k)}
  if(t==9){try{const w=await worklet(c);w.connect(out());nodes.push(w);await groove(w)}catch(e){show('worklet failed: '+e.message);return}}
  if(t==10){el=new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=');el.loop=true;el.play().catch(()=>{});await groove(out())}
  if(t==11){location.href='mobile.html';return}
  show(stat())}
document.querySelectorAll('button[data-t]').forEach(b=>b.onclick=()=>{run(+b.dataset.t).then(()=>b.classList.add('on')).catch(e=>show('error: '+e.message))});
document.getElementById('stop').onclick=stop;
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
</script></body></html>
